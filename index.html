<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>IPTV Live · Stream Hub</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.14.28/controls.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none; /* avoid accidental selection on double-click */
    }

    :root {
      --accent: #61dafb;
      --accent-glow: rgba(97, 218, 251, 0.4);
      --bg: #0a0c10;
      --card-bg: #1c212a;
      --glass: rgba(255, 255, 255, 0.05);
      --text-dim: #a0a0a0;
      --shadow: 0 10px 30px rgba(0,0,0,0.5);
      --border-radius-card: 24px;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      background: var(--bg);
      color: white;
      overflow: hidden;
      height: 100vh;
    }

    /* VIDEO CONTAINER (fullscreen player) */
    #video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: black;
      display: block !important;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* fallback for audio-only streams */
    #audio-fallback {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 2;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: radial-gradient(circle at center, #0a0c10, #030405);
    }

    #audio-fallback h2 {
      font-size: 2rem;
      color: white;
      margin: 0;
    }

    #audio-fallback p {
      color: var(--accent);
      font-size: 1.2rem;
    }

    /* UI OVERLAY (channel list) */
    #ui-layer {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: radial-gradient(circle at 20% 30%, rgba(10,12,16,0.92) 0%, rgba(10,12,16,0.98) 100%);
      backdrop-filter: blur(2px);
      transition: opacity 0.3s ease, visibility 0.3s;
      padding: 24px 40px;
      box-sizing: border-box;
    }

    #ui-layer.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* header */
    #header-info {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
      color: var(--text-dim);
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    #channel-count {
      background: var(--glass);
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.85rem;
    }

    #clock {
      font-size: 1rem;
      font-weight: 500;
      background: var(--glass);
      padding: 6px 14px;
      border-radius: 40px;
    }

    /* search bar */
    #search-section {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    #search-box {
      width: 70%;
      max-width: 500px;
      background: rgba(20, 25, 35, 0.9);
      border: 2px solid #2a2f3a;
      border-radius: 60px;
      padding: 14px 28px;
      color: white;
      font-size: 1.1rem;
      outline: none;
      text-align: center;
      transition: all 0.2s;
      font-weight: 500;
    }

    #search-box:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
      background: #11161f;
    }

    /* channel grid */
    #channel-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 22px;
      overflow-y: auto;
      padding: 12px 6px 30px 6px;
      outline: none;
      align-content: start;
    }

    /* custom scroll */
    #channel-grid::-webkit-scrollbar {
      width: 6px;
    }

    #channel-grid::-webkit-scrollbar-track {
      background: #1a1f28;
      border-radius: 8px;
    }

    #channel-grid::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 8px;
    }

    .channel-card {
      background: var(--card-bg);
      padding: 20px 12px;
      border-radius: var(--border-radius-card);
      text-align: center;
      cursor: pointer;
      outline: none;
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: transform 0.2s, background 0.2s, border 0.1s;
      box-shadow: 0 5px 12px rgba(0,0,0,0.3);
    }

    .channel-card.filtered-out {
      display: none;
    }

    .channel-card:focus-visible {
      border-color: var(--accent);
      transform: scale(1.03);
      background: #2a313e;
      box-shadow: 0 0 0 3px rgba(97, 218, 251, 0.3);
    }

    .channel-card:hover {
      background: #252d3a;
      transform: translateY(-4px);
    }

    .logo-box {
      width: 80px;
      height: 80px;
      margin-bottom: 4px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.25);
      border-radius: 20px;
      padding: 8px;
    }

    .channel-card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    }

    .letter-fallback {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--accent);
      text-shadow: 0 0 5px rgba(97,218,251,0.5);
    }

    .channel-card span {
      display: block;
      width: 100%;
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      color: #eef2ff;
    }

    /* custom ko-fi card */
    .channel-card.custom-card {
      background: linear-gradient(135deg, #2b2f3a, #1e222b);
      border: 1px solid rgba(255,215,0,0.3);
    }

    /* loader */
    #loader {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 200;
      display: none;
      background: rgba(0,0,0,0.7);
      padding: 20px;
      border-radius: 60px;
      backdrop-filter: blur(8px);
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #2a2f3a;
      border-top: 5px solid var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
</div>

<div id="video-container" data-shaka-player-container class="shaka-video-container">
  <video id="video" autoplay playsinline class="shaka-video"></video>
  <div id="audio-fallback">
    <h2 id="fallback-name">Station</h2>
    <p>🎧 Audio Only Stream</p>
  </div>
</div>

<div id="ui-layer">
  <div id="header-info">
    <span id="channel-count">📡 Loading channels...</span>
    <span id="clock">--:--</span>
  </div>
  <div id="search-section">
    <input type="text" id="search-box" placeholder="🔍 Search channels..." autocomplete="off">
  </div>
  <div id="channel-grid" tabindex="-1">
    <!-- dynamic cards injected here -->
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.14.28/shaka-player.ui.min.js"></script>

<script>
  // ----------------------------- GLOBALS ---------------------------------
  let player = null;
  let ui = null;
  let allChannels = [];         // stores channel objects from JSON
  let lastFocusedElement = null;

  const video = document.getElementById('video');
  const videoContainer = document.getElementById('video-container');
  const uiLayer = document.getElementById('ui-layer');
  const loader = document.getElementById('loader');
  const searchBox = document.getElementById('search-box');
  const channelGrid = document.getElementById('channel-grid');
  const fallbackDiv = document.getElementById('audio-fallback');
  const fallbackNameSpan = document.getElementById('fallback-name');

  // Helper: toggle UI / exit fullscreen
  const toggleUI = (show) => {
    if (show) {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      uiLayer.classList.remove('hidden');
      // restore focus to last focused card or search
      setTimeout(() => {
        const target = (lastFocusedElement && document.body.contains(lastFocusedElement)) ? lastFocusedElement : searchBox;
        if (target) target.focus();
      }, 50);
      window.history.pushState({ ui: 'visible' }, '');
    } else {
      uiLayer.classList.add('hidden');
    }
  };

  window.onpopstate = () => {
    if (uiLayer.classList.contains('hidden')) toggleUI(true);
  };

  // ----------- load remote JSON channel list ----------------
  async function loadChannelsFromJson() {
    const jsonUrl = 'https://raw.githubusercontent.com/Joker7263/Nba-live/refs/heads/main/all%20channel.json';
    try {
      const response = await fetch(jsonUrl);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      // support both array 'channels' and top5 array (if needed)
      let channelArray = data.channels || [];
      if (!Array.isArray(channelArray)) channelArray = [];
      // enrich each channel: ensure streamUrl, name, fallback logo placeholder
      const enriched = channelArray.map(ch => ({
        name: ch.name || 'Untitled',
        streamUrl: ch.streamUrl || ch.url || null,
        logoLocal: ch.logoLocal || null,
        category: ch.category || 'General',
        drm: ch.drm || null,
        headers: ch.headers || null,
        type: ch.type || 'dash',
        standbyUrls: ch.standbyUrls || []
      })).filter(ch => ch.streamUrl && ch.streamUrl.trim() !== '');

      if (enriched.length === 0) throw new Error('No valid channels found in JSON');
      return enriched;
    } catch (err) {
      console.error('Failed to load channel JSON:', err);
      alert('⚠️ Unable to fetch channel list. Please check network or source.');
      return [];
    }
  }

  // ----------- Shaka player initialization & DRM / headers handling ----------
  async function initShakaPlayer() {
    shaka.polyfill.installAll();
    if (shaka.Player.isBrowserSupported()) {
      player = new shaka.Player(video);
      ui = new shaka.ui.Overlay(player, videoContainer, video);
      ui.configure({
        'controlPanelElements': ['play_pause', 'time_and_duration', 'spacer', 'quality', 'fullscreen'],
        'overflowMenuButtons': ['quality']
      });
      
      // Event for audio-only detection
      player.addEventListener('loaded', () => {
        if (player.isAudioOnly()) {
          fallbackDiv.style.display = 'flex';
        } else {
          fallbackDiv.style.display = 'none';
        }
      });
      
      player.addEventListener('error', (event) => {
        console.error('Shaka error', event.detail);
        // optional: keep UI from breaking
      });
    } else {
      alert('Your browser does not support Shaka Player.');
    }
  }

  // Load a channel with possible DRM & custom headers
  async function playChannel(channel) {
    toggleUI(false);
    fallbackDiv.style.display = 'none';
    loader.style.display = 'block';
    fallbackNameSpan.textContent = channel.name;

    try {
      // reset player config
      player.configure({ drm: { clearKeys: {}, servers: {} } });
      
      // Apply DRM if exists (supports both object map or array of keys)
      if (channel.drm) {
        let clearKeysMap = {};
        if (typeof channel.drm === 'object') {
          // if it's a flat object keyId:key
          if (!channel.drm.keys) {
            clearKeysMap = channel.drm;
          } 
          // if drm.keys is array (e.g., from some entries)
          else if (Array.isArray(channel.drm.keys)) {
            channel.drm.keys.forEach(k => {
              if (k.kid && k.k) clearKeysMap[k.kid] = k.k;
            });
          }
        }
        if (Object.keys(clearKeysMap).length) {
          player.configure({ drm: { clearKeys: clearKeysMap } });
        }
      }

      // custom headers support (User-Agent / Referer)
      if (channel.headers && typeof channel.headers === 'object') {
        const headers = new Map();
        Object.entries(channel.headers).forEach(([key, val]) => {
          headers.set(key, val);
        });
        player.getNetworkingEngine().registerRequestFilter((type, request) => {
          if (type === shaka.net.NetworkingEngine.RequestType.MANIFEST || 
              type === shaka.net.NetworkingEngine.RequestType.SEGMENT) {
            headers.forEach((value, header) => {
              request.headers[header] = value;
            });
          }
        });
      }
      
      // attempt to load the primary streamUrl
      await player.load(channel.streamUrl);
      
      // If stream is HLS / DASH, try to go fullscreen
      if (videoContainer.requestFullscreen) {
        await videoContainer.requestFullscreen();
      }
    } catch (err) {
      console.warn(`Primary stream failed for ${channel.name}:`, err);
      // fallback to standbyUrls if present
      let standbySuccess = false;
      if (channel.standbyUrls && channel.standbyUrls.length) {
        for (let standby of channel.standbyUrls) {
          try {
            await player.load(standby);
            standbySuccess = true;
            break;
          } catch (e) {
            console.warn(`Standby URL failed: ${standby}`);
          }
        }
      }
      if (!standbySuccess) {
        // show ui again and alert
        toggleUI(true);
        alert(`Cannot load "${channel.name}". Stream may be offline.`);
      }
    } finally {
      loader.style.display = 'none';
    }
  }

  // ----------- Render dynamic channel grid based on "allChannels" array ----------
  function renderChannels(channelsArray) {
    channelGrid.innerHTML = '';
    
    // 1) ADD Support me on Ko-fi card (fixed)
    const kofiCard = document.createElement('div');
    kofiCard.className = 'channel-card custom-card';
    kofiCard.tabIndex = 0;
    kofiCard.setAttribute('aria-label', 'Support on Ko-fi');
    kofiCard.innerHTML = `
      <div class="logo-box">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FFDD66' width='48px' height='48px'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 13c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z'/%3E%3C/svg%3E" style="width:48px;">
      </div>
      <span>☕ Support me on Ko-fi</span>
    `;
    kofiCard.onclick = () => { window.open('https://ko-fi.com/acevin', '_blank'); };
    kofiCard.onkeydown = (e) => { if (e.key === 'Enter') kofiCard.onclick(); };
    channelGrid.appendChild(kofiCard);

    // 2) add all channels from JSON
    channelsArray.forEach((ch, idx) => {
      const card = document.createElement('div');
      card.className = 'channel-card';
      card.tabIndex = 0;
      card.setAttribute('data-name', ch.name.toLowerCase());
      card.setAttribute('data-category', (ch.category || '').toLowerCase());
      
      // generate logo or fallback letter
      const firstLetter = ch.name.charAt(0).toUpperCase();
      const logoHtml = `
        <div class="logo-box">
          ${ch.logoLocal ? `<img src="${ch.logoLocal}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` : ''}
          <div class="letter-fallback" style="${ch.logoLocal ? 'display:none' : 'display:flex'}">${firstLetter}</div>
        </div>
        <span>${ch.name}</span>
      `;
      card.innerHTML = logoHtml;
      
      // bind play event
      card.onclick = async () => {
        lastFocusedElement = card;
        await playChannel(ch);
      };
      card.onkeydown = (e) => {
        if (e.key === 'Enter') card.click();
      };
      channelGrid.appendChild(card);
    });
    
    updateChannelCount();
  }

  // filter channels based on search
  function handleSearch(query) {
    const lowerQuery = query.toLowerCase().trim();
    const allCards = Array.from(channelGrid.querySelectorAll('.channel-card:not(.custom-card)'));
    allCards.forEach(card => {
      const channelName = card.getAttribute('data-name') || '';
      const match = channelName.includes(lowerQuery);
      card.classList.toggle('filtered-out', !match);
    });
    updateChannelCount();
  }

  function updateChannelCount() {
    const visible = channelGrid.querySelectorAll('.channel-card:not(.filtered-out):not(.custom-card)').length;
    const total = channelGrid.querySelectorAll('.channel-card:not(.custom-card)').length;
    document.getElementById('channel-count').innerHTML = `📺 ${visible} / ${total} Channels`;
  }

  // ----------- KEYBOARD NAVIGATION (arrow, escape) ----------
  function setupKeyboardNavigation() {
    document.addEventListener('keydown', (e) => {
      const activeElem = document.activeElement;
      const allVisibleCards = Array.from(channelGrid.querySelectorAll('.channel-card:not(.filtered-out)'));
      
      // ESC / Backspace -> show UI if hidden
      if (e.key === 'Escape' || e.key === 'Backspace') {
        if (uiLayer.classList.contains('hidden')) {
          e.preventDefault();
          toggleUI(true);
        }
        return;
      }
      
      // only handle when UI layer is visible and not in search if grid navigation
      if (uiLayer.classList.contains('hidden')) return;
      
      // if focus is inside search box, allow down arrow to grid
      if (activeElem === searchBox && e.key === 'ArrowDown') {
        e.preventDefault();
        if (allVisibleCards.length) allVisibleCards[0].focus();
        return;
      }
      
      // if active is a channel card, handle directional navigation
      if (activeElem && activeElem.classList && activeElem.classList.contains('channel-card')) {
        const currentIndex = allVisibleCards.indexOf(activeElem);
        if (currentIndex === -1) return;
        
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          if (currentIndex > 0) allVisibleCards[currentIndex - 1].focus();
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          if (currentIndex < allVisibleCards.length - 1) allVisibleCards[currentIndex + 1].focus();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          const currentRect = activeElem.getBoundingClientRect();
          let bestCandidate = null;
          let bestDist = Infinity;
          for (let card of allVisibleCards) {
            const rect = card.getBoundingClientRect();
            if (rect.bottom < currentRect.top - 5) {
              const dist = Math.abs(rect.left - currentRect.left);
              if (dist < bestDist) {
                bestDist = dist;
                bestCandidate = card;
              }
            }
          }
          if (bestCandidate) bestCandidate.focus();
          else searchBox.focus();
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          const currentRect = activeElem.getBoundingClientRect();
          let bestCandidate = null;
          let bestDist = Infinity;
          for (let card of allVisibleCards) {
            const rect = card.getBoundingClientRect();
            if (rect.top > currentRect.bottom + 5) {
              const dist = Math.abs(rect.left - currentRect.left);
              if (dist < bestDist) {
                bestDist = dist;
                bestCandidate = card;
              }
            }
          }
          if (bestCandidate) bestCandidate.focus();
        }
      }
    });
  }

  // clock updater
  function startClock() {
    const update = () => {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    };
    update();
    setInterval(update, 1000);
  }

  // ----------- MAIN BOOTSTRAP ----------
  async function bootstrap() {
    await initShakaPlayer();
    const channels = await loadChannelsFromJson();
    if (channels.length === 0) {
      channelGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center; margin-top:80px;">⚠️ No channels available. Please check source.</div>';
      document.getElementById('channel-count').innerText = '0 channels';
      return;
    }
    allChannels = channels;
    renderChannels(allChannels);
    toggleUI(true);
    setupKeyboardNavigation();
    startClock();
    
    // live search
    searchBox.addEventListener('input', (e) => handleSearch(e.target.value));
    
    // optional: refilter if needed
  }
  
  bootstrap().catch(err => {
    console.error('Boot error:', err);
    channelGrid.innerHTML = `<div style="grid-column:1/-1;text-align:center; padding:3rem;">❌ Failed to initialize player. ${err.message}</div>`;
  });
</script>
</body>
</html>
