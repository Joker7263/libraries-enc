    <!-- Anti-tampering & Anti-dump mechanisms integrated -->
    <style>

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--md-sys-color-surface-container); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--md-sys-color-outline); border-radius: 4px; }
        /* Anti-selection on certain elements but not all to avoid UX break */
        .anti-debug-overlay { display: none; }

<body>
<div class="app-container">
    <header>
        <h1>Bread Bypass Formatting Tool</h1>
        <div class="subtitle">Made by BreadOnTop • Secure Build</div>
    </header>
    <section class="card">
        <div class="input-grid">
            <div class="form-group"><label for="libName">Library / Module</label><input type="text" id="libName" value="libanogs.so"></div>
            <div class="form-group"><label for="hexPatch">Hex Patch (bytes)</label><input type="text" id="hexPatch" value="00 00 80 D2 C0 03 5F D6"></div>
        </div>
    </section>
    <section class="card">
        <div class="form-group"><label>Offsets (One per line)</label><textarea id="input" placeholder="0x202894&#10;0x20F7BC&#10;0x210004"></textarea><div class="hint">Unique offsets only, uniform 0x format.</div></div>
        <div class="extract-bar"><span>Extract Offsets From Any Format</span></div>
        <div class="form-group" style="margin-top: 12px;"><label>Paste MemoryPatch or HexPatches lines - only offsets will be extracted</label><textarea id="extractInput" placeholder="HexPatches.MemoryPatch(&quot;libanogs.so&quot;, 0x202894, &quot;h00 00 80 D2 C0 03 5F D6&quot;, 32);&#10;MemoryPatch::createWithHex(&quot;libanogs.so&quot;, 0x1EEDA8, &quot;000080D2C0035FD6&quot;).Modify();" style="min-height: 120px;"></textarea>
            <div class="btn-container"><button class="btn-secondary" id="extractBtn">Extract Offsets Only</button><button class="btn-tonal" id="clearExtractBtn">Clear</button></div>
            <div class="hint">Extracts offset values from MemoryPatch, HexPatches, EncOff, HOOK_LIB, etc.</div>
        </div>
        <div class="btn-container" style="margin-top: 16px;"><button class="btn-tonal btn-icon-only" id="pasteBtn">Paste</button><button class="btn-primary" id="generateBtn">Generate All Formats</button></div>
    </section>
    <div class="global-bar" id="globalActions"><span style="font-weight: 600;">All formats ready - Download or Copy</span><div class="btn-container" style="margin-top: 0;"><button class="btn-tonal" id="copyAllBtn">Copy All</button><button class="btn-tonal" id="saveAllBtn">Save All (txt)</button></div></div>
    <div id="results-area"></div>
</div>
<div id="toast" class="toast">Ready</div>

<script>
    // ======================== ADVANCED ANTI-VIEW-SOURCE & ANTI-DUMP ========================
    (function() {
        // 1. Disable right-click context menu globally (view source prevention via context)
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            showProtectionToast("Context menu disabled");
            return false;
        });
        
        // 2. Block key combinations that expose source: Ctrl+U, Ctrl+S, Ctrl+Shift+I, F12, Ctrl+Shift+J, Ctrl+Shift+C, Ctrl+E, Ctrl+O
        window.addEventListener('keydown', function(e) {
            // F12
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                showProtectionToast("Developer tools blocked");
                return false;
            }
            // Ctrl+Shift+I (inspect), Ctrl+Shift+J (console), Ctrl+Shift+C (element picker), Ctrl+U (view source), Ctrl+S (save)
            if ((e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.key === 'i' || e.key === 'j' || e.key === 'c')) ||
                (e.ctrlKey && (e.key === 'u' || e.key === 'U')) ||
                (e.ctrlKey && (e.key === 's' || e.key === 'S')) ||
                (e.ctrlKey && (e.key === 'o' || e.key === 'O')) ||
                (e.ctrlKey && e.shiftKey && (e.key === 'E' || e.key === 'e'))) {
                e.preventDefault();
                showProtectionToast("Source view/download restricted");
                return false;
            }
            // Ctrl+Shift+K (Firefox console)
            if (e.ctrlKey && e.shiftKey && (e.key === 'K' || e.key === 'k')) {
                e.preventDefault();
                showProtectionToast("Console access restricted");
                return false;
            }
            // Ctrl+E (search/developer tools sometimes), also blocked
        });
        
        // 3. Disable text selection on sensitive areas? but full body selection allowed for user copy but this is not for source dump.
        // Additionally: override console.log / console.clear detection spamming? We'll add a detection for devtools open heuristic.
        // Devtools detection: if window height/width diff or element inspector.
        let devtoolsOpen = false;
        const devtoolsCheck = () => {
            const threshold = 160;
            const widthDiff = window.outerWidth - window.innerWidth > threshold;
            const heightDiff = window.outerHeight - window.innerHeight > threshold;
            if (widthDiff || heightDiff) {
                if (!devtoolsOpen) {
                    devtoolsOpen = true;
                    showProtectionToast("Developer tools detected — restricted operation");
                    // Optional: clear or disrupt but we just warn and disable some features? 
                    // Not breaking core logic but annoy attempts.
                    document.body.style.opacity = "0.99";
                    setTimeout(() => { document.body.style.opacity = "1"; }, 100);
                }
            } else {
                devtoolsOpen = false;
            }
        };
        setInterval(devtoolsCheck, 1500);
        
        // 4. Anti debugger: prevent breakpoint by redefining Function constructor? but fine. 
        // Override console methods to avoid source logging? Not needed but add noise.
        const noop = () => {};
        if (window.console) {
            const originalLog = console.log;
            console.log = function(...args) {
                if (args.length && typeof args[0] === 'string' && (args[0].includes('source') || args[0].includes('debug'))) {
                    return;
                }
                originalLog.apply(console, args);
            };
        }
        
        // 5. Prevent dragging & dropping to view source
        window.addEventListener('dragenter', function(e) { e.preventDefault(); });
        window.addEventListener('dragover', function(e) { e.preventDefault(); });
        window.addEventListener('drop', function(e) { e.preventDefault(); showProtectionToast("Drop blocked"); });
        
        // 6. Override 'view-source:' URI attempt using beforeunload? Not robust but we can warn
        if (window.location.protocol === 'view-source:') {
            window.location.href = 'about:blank';
        }
        
        // 7. MutationObserver to detect if somebody injects script to dump DOM — optional but adds layer
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.type === 'childList' && mutation.addedNodes.length) {
                    for (let node of mutation.addedNodes) {
                        if (node.nodeType === 1 && node.tagName === 'SCRIPT' && node.src && node.src.includes('devtools')) {
                            node.remove();
                        }
                    }
                }
            });
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
        
        // 8. Disable Print (Ctrl+P) to avoid physical dump of source
        window.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P')) {
                e.preventDefault();
                showProtectionToast("Print/Save as PDF restricted");
                return false;
            }
        });
        
        // 9. Override native getter for scripts content? not possible but we add faux encryption for eval detection?
        // extra: add style to hide any tooltip that could leak source path
        // Additionally block selection on document fragments? fine.
        function showProtectionToast(msg) {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.textContent = `⚠️ ${msg}`;
                toast.style.backgroundColor = '#b0003a';
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1800);
                setTimeout(() => { if(toast) toast.style.backgroundColor = '#2e2e32'; }, 2000);
            }
        }
        // Also block 'Inspect Element' through long press on mobile? Not needed but via contextmenu already handled.
        // Remove any added iframe or external script attempts.
        Object.defineProperty(document, 'cookie', {
            configurable: false,
            get: function() { return ""; },
            set: function() { return false; }
        }); // not for anti dump but extra obscurity
        
        // Prevent saving of HTML via Data URL if user tries custom bookmarklet (additional check)
        setInterval(() => {
            const iframes = document.querySelectorAll('iframe');
            iframes.forEach(iframe => { if (iframe.src && iframe.src.startsWith('javascript:')) iframe.remove(); });
        }, 2000);
    })();
    
    // ======================== CORE FUNCTIONALITY (ORIGINAL BUT PRESERVED) ========================
    const libInput = document.getElementById('libName');
    const hexPatchInput = document.getElementById('hexPatch');
    const offsetsTextarea = document.getElementById('input');
    const extractInput = document.getElementById('extractInput');
    const extractBtn = document.getElementById('extractBtn');
    const clearExtractBtn = document.getElementById('clearExtractBtn');
    const resultsContainer = document.getElementById('results-area');
    const globalActionsDiv = document.getElementById('globalActions');
    const toastEl = document.getElementById('toast');
    const generateButton = document.getElementById('generateBtn');
    const pasteButton = document.getElementById('pasteBtn');
    const copyAllButton = document.getElementById('copyAllBtn');
    const saveAllButton = document.getElementById('saveAllBtn');
    let masterFullOutput = "";
    
    function showToast(message, isError = false) {
        toastEl.textContent = message;
        toastEl.style.backgroundColor = isError ? '#b0003a' : '#2e2e32';
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 2800);
    }
    function normalizeOffset(offsetStr) {
        let clean = offsetStr.toString();
        clean = clean.replace(/^0x/i, '');
        clean = clean.toUpperCase();
        return `0x${clean}`;
    }
    function accurateExtractOffsets(text) {
        const offsetsSet = new Set();
        const patterns = [
            /MemoryPatch::createWithHex\s*\(\s*"[^"]*"\s*,\s*(0x[0-9A-Fa-f]+)\s*,/gi,
            /HexPatches\.MemoryPatch\s*\(\s*"[^"]*"\s*,\s*(0x[0-9A-Fa-f]+)\s*,/gi,
            /HOOK_LIB\s*\(\s*"[^"]*"\s*,\s*"(0x[0-9A-Fa-f]+)"/gi,
            /EncOff\s*\(\s*(0x[0-9A-Fa-f]+)/gi,
            /(?:Tools::Hook|DobbyHook)\s*\([^,]*,\s*(0x[0-9A-Fa-f]+)/gi,
            /HexPatches\.MemoryPatch\s*\(\s*"[^"]*"\s*,\s*(0x[0-9A-Fa-f]+)/gi
        ];
        for (const pattern of patterns) {
            let match;
            while ((match = pattern.exec(text)) !== null) {
                offsetsSet.add(normalizeOffset(match[1]));
            }
        }
        const standaloneHex = /\b(0x[0-9A-Fa-f]{3,8})\b/gi;
        let match;
        while ((match = standaloneHex.exec(text)) !== null) {
            const offset = normalizeOffset(match[1]);
            const beforePos = Math.max(0, match.index - 50);
            const afterPos = Math.min(text.length, match.index + offset.length + 50);
            const context = text.substring(beforePos, afterPos);
            if (context.includes('"') && context.indexOf(offset) > context.indexOf('"') && context.indexOf(offset) < context.lastIndexOf('"')) {
                continue;
            }
            const hexValue = offset.replace('0x', '');
            if (hexValue.length >= 3 && hexValue.length <= 8) {
                offsetsSet.add(offset);
            }
        }
        const offsetsArray = Array.from(offsetsSet);
        offsetsArray.sort((a, b) => parseInt(a, 16) - parseInt(b, 16));
        return offsetsArray;
    }
    function normalizeExistingOffsets() {
        const currentText = offsetsTextarea.value.trim();
        if (!currentText) return [];
        const lines = currentText.split(/\r?\n/);
        const uniqueOffsets = new Set();
        for (let line of lines) {
            line = line.trim();
            if (line === "") continue;
            let hexStr = line.replace(/^0x/i, '').toUpperCase();
            if (/^[0-9A-F]+$/.test(hexStr) && hexStr.length <= 8 && hexStr.length >= 1) {
                uniqueOffsets.add(`0x${hexStr}`);
            }
        }
        return Array.from(uniqueOffsets).sort((a, b) => parseInt(a, 16) - parseInt(b, 16));
    }
    function updateOffsetsTextarea(offsetsArray) {
        offsetsTextarea.value = offsetsArray.length ? offsetsArray.join('\n') : "";
    }
    function extractAndAddOffsets() {
        const extractText = extractInput.value;
        if (!extractText.trim()) { showToast("Please paste code with offsets first", true); return; }
        const extractedOffsets = accurateExtractOffsets(extractText);
        if (extractedOffsets.length === 0) { showToast("No valid offsets found", true); return; }
        const existingOffsets = normalizeExistingOffsets();
        const allOffsetsSet = new Set([...existingOffsets, ...extractedOffsets]);
        const sortedOffsets = Array.from(allOffsetsSet).sort((a, b) => parseInt(a, 16) - parseInt(b, 16));
        updateOffsetsTextarea(sortedOffsets);
        const newCount = extractedOffsets.filter(o => !existingOffsets.includes(o)).length;
        showToast(`Extracted ${extractedOffsets.length} offset(s). Added ${newCount} new. Total: ${sortedOffsets.length} unique offsets.`, false);
    }
    function clearExtractField() { extractInput.value = ""; showToast("Extract field cleared", false); }
    function parseOffsets(rawText) {
        const lines = rawText.split(/\r?\n/);
        const offsets = [];
        for (let line of lines) {
            line = line.trim();
            if (line === "") continue;
            let hexStr = line.replace(/^0x/i, '');
            if (/^[0-9A-Fa-f]+$/.test(hexStr)) {
                const num = parseInt(hexStr, 16);
                if (!isNaN(num) && isFinite(num) && hexStr.length <= 8) { offsets.push(num); }
            }
        }
        return [...new Set(offsets)];
    }
    function generateEncOff(offsets) { let result = "/* ===== EncOff FORMAT ===== */\n"; offsets.forEach(offset => { result += `EncOff(0x${offset.toString(16).toUpperCase()}),\n`; }); return result.trim(); }
    function generateBypassOffsets(offsets) { let result = "/* ===== BYPASS OFFSETS ===== */\n"; offsets.forEach((offset, idx) => { result += `inline uintptr_t bypass${idx+1} = 0x${offset.toString(16).toUpperCase()};\n`; }); return result.trim(); }
    function generateDirectPatch(offsets, lib, patchHex) { let result = "/* ===== DIRECT MEMORY PATCH ===== */\n"; offsets.forEach(offset => { result += `MemoryPatch::createWithHex("${lib}", 0x${offset.toString(16).toUpperCase()}, "${patchHex.replace(/ /g, '')}").Modify();\n`; }); return result.trim(); }
    function generateArmFalsePatch(offsets, lib) { let result = "/* ===== BYPASS MEMORY PATCH (armFalse) ===== */\n"; offsets.forEach((offset, idx) => { result += `MemoryPatch::createWithHex(OBFUSCATE("${lib}"), bypass${idx+1}, armFalse).Modify();\n`; }); return result.trim(); }
    function generateToolsHook(offsets, lib) { let result = "/* ===== TOOLS::HOOK CALLS ===== */\n"; offsets.forEach(offset => { result += `Tools::Hook((void*)getAbsoluteAddress(OBFUSCATE("${lib}"), 0x${offset.toString(16).toUpperCase()}), (void*)hook_bypass, (void**)&orig_bypass);\n`; }); return result.trim(); }
    function generateDobbyHook(offsets, lib) { let result = "/* ===== DOBBY HOOK CALLS ===== */\n"; offsets.forEach(offset => { result += `DobbyHook((void*)getAbsoluteAddress(OBFUSCATE("${lib}"), 0x${offset.toString(16).toUpperCase()}), (void*)hook_bypass, (void**)&orig_bypass);\n`; }); return result.trim(); }
    function generateHookLibFormat(offsets, lib) { let result = "/* ===== HOOK_LIB FORMAT ===== */\n"; offsets.forEach(offset => { result += `HOOK_LIB("${lib}", "0x${offset.toString(16).toUpperCase()}", h_disabled, o_disabled);\n`; }); return result.trim(); }
    function generateHexPatchInjector(offsets, lib, patchHex) {
        let result = "/* ===== HEXPATCH (INJECTOR) ===== */\n";
        let patchWithHPrefix = patchHex.trim();
        if (!patchWithHPrefix.startsWith('h')) { patchWithHPrefix = 'h' + patchWithHPrefix; }
        offsets.forEach(offset => { result += `HexPatches.MemoryPatch("${lib}", 0x${offset.toString(16).toUpperCase()}, "${patchWithHPrefix}", 32);\n`; });
        return result.trim();
    }
    const formatList = [
        { id: "encoff", title: "EncOff Format", ext: "txt", generator: (offsets, lib, patch) => generateEncOff(offsets) },
        { id: "bypass_offsets", title: "Bypass Offsets (C++)", ext: "cpp", generator: (offsets, lib, patch) => generateBypassOffsets(offsets) },
        { id: "direct_patch", title: "Direct Memory Patch", ext: "cpp", generator: (offsets, lib, patch) => generateDirectPatch(offsets, lib, patch) },
        { id: "armfalse_patch", title: "ArmFalse Patch", ext: "cpp", generator: (offsets, lib, patch) => generateArmFalsePatch(offsets, lib) },
        { id: "tools_hook", title: "Tools::Hook Calls", ext: "cpp", generator: (offsets, lib, patch) => generateToolsHook(offsets, lib) },
        { id: "dobby_hook", title: "Dobby Hook Calls", ext: "cpp", generator: (offsets, lib, patch) => generateDobbyHook(offsets, lib) },
        { id: "hook_lib", title: "Hook Lib Format", ext: "cpp", generator: (offsets, lib, patch) => generateHookLibFormat(offsets, lib) },
        { id: "hexpatch_injector", title: "HexPatch (Injector LUA)", ext: "lua", generator: (offsets, lib, patch) => generateHexPatchInjector(offsets, lib, patch) }
    ];
    
    function generateAllFormats() {
        const libName = libInput.value.trim();
        if (libName === "") { showToast("Library name cannot be empty!", true); return; }
        const hexPatchRaw = hexPatchInput.value.trim();
        let patchValue = hexPatchRaw !== "" ? hexPatchRaw : "00 00 80 D2 C0 03 5F D6";
        const offsetRawText = offsetsTextarea.value;
        if (!offsetRawText.trim()) { showToast("Please enter at least one offset address.", true); return; }
        const offsets = parseOffsets(offsetRawText);
        if (offsets.length === 0) { showToast("No valid hex offsets found!", true); return; }
        showToast(`Parsed ${offsets.length} unique offset(s). Generating formats...`, false);
        resultsContainer.innerHTML = "";
        resultsContainer.classList.remove("active");
        globalActionsDiv.classList.remove("visible");
        let combinedOutput = "// BREAD BYPASS FORMAT GENERATOR //\n";
        combinedOutput += `// Library: ${libName} | Offsets: ${offsets.length} | Patch: ${patchValue}\n\n`;
        for (const fmt of formatList) {
            let generatedContent = fmt.generator(offsets, libName, patchValue) || `// ERROR generating ${fmt.title}`;
            combinedOutput += `// ---------- ${fmt.title} ----------\n${generatedContent}\n\n`;
            const card = document.createElement('div'); card.className = 'result-card';
            const headerDiv = document.createElement('div'); headerDiv.className = 'result-header';
            const titleSpan = document.createElement('span'); titleSpan.className = 'result-title'; titleSpan.textContent = fmt.title;
            const badgeSpan = document.createElement('span'); badgeSpan.style.fontSize = "10px"; badgeSpan.style.opacity = "0.7"; badgeSpan.textContent = `.${fmt.ext}`;
            headerDiv.appendChild(titleSpan); headerDiv.appendChild(badgeSpan);
            const previewDiv = document.createElement('div'); previewDiv.className = 'code-preview'; previewDiv.textContent = generatedContent;
            const hiddenStore = document.createElement('textarea'); hiddenStore.className = 'hidden'; hiddenStore.value = generatedContent;
            const actionsDiv = document.createElement('div'); actionsDiv.className = 'result-actions';
            const copyBtn = document.createElement('button'); copyBtn.className = 'btn-tonal'; copyBtn.textContent = 'Copy';
            copyBtn.onclick = () => { navigator.clipboard.writeText(generatedContent).then(() => showToast(`Copied ${fmt.title}`)).catch(() => showToast("Copy failed", true)); };
            const saveBtn = document.createElement('button'); saveBtn.className = 'btn-tonal'; saveBtn.textContent = `Save .${fmt.ext}`;
            saveBtn.onclick = () => { downloadBlob(hiddenStore.value, `${fmt.id}_${Date.now()}.${fmt.ext}`); showToast(`Saved ${fmt.id}.${fmt.ext}`); };
            actionsDiv.appendChild(copyBtn); actionsDiv.appendChild(saveBtn);
            card.appendChild(headerDiv); card.appendChild(previewDiv); card.appendChild(hiddenStore); card.appendChild(actionsDiv);
            resultsContainer.appendChild(card);
        }
        masterFullOutput = combinedOutput;
        resultsContainer.classList.add('active');
        globalActionsDiv.classList.add('visible');
        showToast(`Success! ${offsets.length} unique offsets → ${formatList.length} formats ready.`, false);
    }
    function downloadBlob(content, filename) { const blob = new Blob([content], { type: "text/plain;charset=utf-8" }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); }
    function copyAllOutput() { if (!masterFullOutput) { showToast("Nothing to copy. Generate formats first.", true); return; } navigator.clipboard.writeText(masterFullOutput).then(() => showToast("Copied ALL formats!")).catch(() => showToast("Copy failed", true)); }
    function saveAllOutput() { if (!masterFullOutput) { showToast("No output generated. Please run generation first.", true); return; } const timestamp = new Date().toISOString().slice(0,19).replace(/:/g, '-'); downloadBlob(masterFullOutput, `Bread_Bypass_All_${timestamp}.txt`); showToast("Full output saved as txt file"); }
    async function pasteFromClipboard() { try { const text = await navigator.clipboard.readText(); offsetsTextarea.value = text; showToast("Pasted from clipboard!"); } catch (err) { showToast("Could not paste. Allow clipboard permissions.", true); } }
    generateButton.addEventListener('click', generateAllFormats);
    pasteButton.addEventListener('click', pasteFromClipboard);
    copyAllButton.addEventListener('click', copyAllOutput);
    saveAllButton.addEventListener('click', saveAllOutput);
    extractBtn.addEventListener('click', extractAndAddOffsets);
    clearExtractBtn.addEventListener('click', clearExtractField);
    window.addEventListener('DOMContentLoaded', () => { showToast("Secure mode enabled - Anti view-source active", false); });
</script>
</body>
</html>
