<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iYAD TV · Live Streams</title>
  <link rel="stylesheet" href="https://vjs.zencdn.net/8.10.0/video-js.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.7/shaka-player.compiled.js"></script>
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/videojs-youtube@3.0.1/dist/Youtube.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0a0e17;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding-bottom: 80px;
    }
    .app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }
    .logo img { height: 48px; }
    .search-bar {
      flex: 2;
      min-width: 200px;
      display: flex;
      background: #1a1f2e;
      border-radius: 48px;
      padding: 4px 16px;
      gap: 8px;
    }
    .search-bar input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px 0;
      color: white;
      font-size: 1rem;
      outline: none;
    }
    .search-bar button {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 1.2rem;
    }
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .filter-chip {
      background: #1a1f2e;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.8rem;
      color: #ccd6f0;
      cursor: pointer;
    }
    .filter-chip.active {
      background: #3b4b6e;
      color: white;
    }
    .channel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
    }
    .channel-card {
      background: #131826;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      border: 1px solid #252c3d;
    }
    .channel-card:hover {
      transform: translateY(-4px);
      background: #1a2133;
      border-color: #4a5a7a;
    }
    .channel-logo {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: #0a0e17;
    }
    .channel-info {
      padding: 10px 8px;
      text-align: center;
    }
    .channel-name {
      font-weight: 600;
      font-size: 0.85rem;
      color: #f0f3fa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .channel-category {
      font-size: 0.7rem;
      color: #8f9bb5;
      margin-top: 4px;
    }
    #loading-indicator {
      text-align: center;
      padding: 60px;
      color: white;
    }
    #error-message {
      text-align: center;
      padding: 40px;
      color: #ff6b6b;
      display: none;
    }
    /* Player overlay */
    #player-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      z-index: 10000;
      display: none;
      flex-direction: column;
    }
    .player-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      z-index: 10001;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .player-info {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0,0,0,0.5);
      padding: 6px 16px;
      border-radius: 40px;
      backdrop-filter: blur(8px);
      pointer-events: auto;
    }
    .player-info img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }
    .player-info span {
      color: white;
      font-weight: 600;
    }
    #close-player {
      background: rgba(0,0,0,0.6);
      border: none;
      color: white;
      font-size: 24px;
      width: 44px;
      height: 44px;
      border-radius: 44px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      pointer-events: auto;
    }
    .video-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, .video-js {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e2a3a;
      color: white;
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 0.85rem;
      z-index: 10002;
      display: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="logo">
      <img src="https://cdn.iyad.space/logo.png" alt="iYAD TV" onerror="this.style.display='none'">
    </div>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search channel...">
      <button id="search-btn"><i class="fas fa-search"></i></button>
      <button id="clear-btn" style="display:none;"><i class="fas fa-times"></i></button>
    </div>
  </div>

  <div id="category-filter" class="filter-bar"></div>
  <div id="channel-grid" class="channel-grid"></div>
  <div id="loading-indicator">📡 Loading channels...</div>
  <div id="error-message"></div>
</div>

<div id="player-overlay">
  <div class="player-header">
    <div class="player-info">
      <img id="player-logo" src="">
      <span id="player-name"></span>
    </div>
    <button id="close-player"><i class="fas fa-times"></i></button>
  </div>
  <div class="video-container">
    <video id="video-element" autoplay playsinline style="width:100%;height:100%"></video>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
  // ========== GLOBAL ==========
  let allChannels = [];
  let filteredChannels = [];
  let currentCategory = 'All';
  let currentPlayer = null;
  let currentHls = null;
  let currentShaka = null;
  
  const gridEl = document.getElementById('channel-grid');
  const loadingEl = document.getElementById('loading-indicator');
  const errorEl = document.getElementById('error-message');
  const playerOverlay = document.getElementById('player-overlay');
  const videoEl = document.getElementById('video-element');
  const playerNameSpan = document.getElementById('player-name');
  const playerLogo = document.getElementById('player-logo');
  const closePlayerBtn = document.getElementById('close-player');
  const toastEl = document.getElementById('toast');
  
  function showToast(msg, duration = 2500) {
    toastEl.textContent = msg;
    toastEl.style.display = 'block';
    setTimeout(() => { toastEl.style.display = 'none'; }, duration);
  }
  
  function destroyPlayer() {
    if (currentHls) {
      currentHls.destroy();
      currentHls = null;
    }
    if (currentShaka) {
      currentShaka.destroy();
      currentShaka = null;
    }
    if (currentPlayer) {
      currentPlayer.dispose?.();
      currentPlayer = null;
    }
    videoEl.pause();
    videoEl.src = '';
    videoEl.load();
  }
  
  function closePlayer() {
    destroyPlayer();
    playerOverlay.style.display = 'none';
    document.body.style.overflow = '';
  }
  
  // ========== SMART PLAYER ==========
  async function playChannel(channel) {
    closePlayer();
    destroyPlayer();
    
    let streamUrl = channel.streamUrl;
    if (!streamUrl && channel.standbyUrls?.length) {
      streamUrl = channel.standbyUrls[0];
    }
    if (!streamUrl) {
      showToast(`❌ No stream URL for ${channel.name}`);
      return;
    }
    
    playerNameSpan.textContent = channel.name;
    if (channel.logoLocal) {
      playerLogo.src = `https://cdn.iyad.space/logos/${channel.logoLocal}.png`;
    } else {
      playerLogo.src = '';
    }
    
    playerOverlay.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    
    // Determine stream type
    const isYoutube = channel.type === 'youtube-channel' || 
                      streamUrl.includes('youtube.com') || 
                      streamUrl.includes('youtu.be') ||
                      streamUrl.startsWith('@');
    
    const isM3u8 = streamUrl.includes('.m3u8') || streamUrl.includes('/hls/') || streamUrl.includes('playlist.m3u8');
    const isMpd = streamUrl.includes('.mpd') || streamUrl.includes('/dash/') || streamUrl.includes('manifest.mpd');
    
    // HLS
    if (isM3u8 && Hls.isSupported()) {
      try {
        currentHls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          maxBufferLength: 30,
        });
        currentHls.loadSource(streamUrl);
        currentHls.attachMedia(videoEl);
        currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
          videoEl.play().catch(e => console.warn('autoplay blocked', e));
        });
        currentHls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) {
            console.error('HLS fatal error', data);
            showToast(`⚠️ Stream error: ${channel.name}`);
            if (channel.standbyUrls?.length) {
              const nextUrl = channel.standbyUrls.find(u => u !== streamUrl);
              if (nextUrl) {
                showToast(`🔄 Trying alternate stream...`);
                setTimeout(() => playChannel({ ...channel, streamUrl: nextUrl }), 1000);
              }
            }
          }
        });
        return;
      } catch(e) { console.warn('HLS init failed', e); }
    }
    
    // DASH with Shaka
    if (isMpd && typeof shaka !== 'undefined') {
      try {
        currentShaka = new shaka.Player(videoEl);
        await currentShaka.load(streamUrl);
        currentShaka.addEventListener('error', (e) => {
          console.error('Shaka error', e);
          showToast(`DASH error: ${channel.name}`);
        });
        videoEl.play().catch(e => console.warn(e));
        return;
      } catch(e) { console.warn('Shaka failed', e); }
    }
    
    // YouTube
    if (isYoutube) {
      let youtubeUrl = streamUrl;
      if (streamUrl.startsWith('@')) {
        youtubeUrl = `https://www.youtube.com/${streamUrl}/live`;
      }
      if (!youtubeUrl.includes('youtube.com')) {
        youtubeUrl = `https://www.youtube.com/@${streamUrl.replace('@','')}/live`;
      }
      
      if (window.videojs) {
        destroyPlayer();
        const vjsPlayer = videojs(videoEl, {
          techOrder: ['youtube'],
          autoplay: true,
          controls: true,
          sources: [{ src: youtubeUrl, type: 'video/youtube' }]
        });
        currentPlayer = vjsPlayer;
        vjsPlayer.ready(() => {
          vjsPlayer.play().catch(e => console.warn('YouTube autoplay', e));
        });
        vjsPlayer.on('error', () => {
          showToast(`YouTube error: ${channel.name}`);
        });
        return;
      } else {
        showToast('YouTube player not ready');
      }
    }
    
    // Fallback native HLS (Safari)
    if (isM3u8 && videoEl.canPlayType('application/vnd.apple.mpegurl')) {
      videoEl.src = streamUrl;
      videoEl.play().catch(e => showToast('Playback failed'));
      return;
    }
    
    // Last resort: try native with CORS
    videoEl.src = streamUrl;
    videoEl.play().catch(e => {
      showToast(`Cannot play: ${channel.name}`);
      console.error(e);
    });
  }
  
  // ========== RENDER CHANNELS ==========
  function renderChannels(channels) {
    if (!channels.length) {
      gridEl.innerHTML = '<div style="color:white; text-align:center; padding:40px;">📺 No channels found</div>';
      return;
    }
    gridEl.innerHTML = '';
    for (const ch of channels) {
      const card = document.createElement('div');
      card.className = 'channel-card';
      const logoUrl = ch.logoLocal ? `https://cdn.iyad.space/logos/${ch.logoLocal}.png` : '';
      card.innerHTML = `
        <img class="channel-logo" src="${logoUrl}" alt="${escapeHtml(ch.name)}" onerror="this.src='https://via.placeholder.com/300x169?text=No+Logo'">
        <div class="channel-info">
          <div class="channel-name">${escapeHtml(ch.name)}</div>
          <div class="channel-category">${escapeHtml(ch.category || 'General')}</div>
        </div>
      `;
      card.onclick = () => playChannel(ch);
      gridEl.appendChild(card);
    }
  }
  
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
  
  // ========== FILTERS ==========
  function updateFilters() {
    const cats = new Set(['All']);
    allChannels.forEach(ch => { if (ch.category) cats.add(ch.category); });
    const filterBar = document.getElementById('category-filter');
    filterBar.innerHTML = '';
    for (let cat of cats) {
      const chip = document.createElement('div');
      chip.className = `filter-chip ${currentCategory === cat ? 'active' : ''}`;
      chip.textContent = cat;
      chip.onclick = () => {
        currentCategory = cat;
        applyFilterAndSearch();
        updateFilters();
      };
      filterBar.appendChild(chip);
    }
  }
  
  function applyFilterAndSearch() {
    const searchTerm = document.getElementById('search-input').value.trim().toLowerCase();
    let filtered = [...allChannels];
    if (currentCategory !== 'All') {
      filtered = filtered.filter(ch => ch.category === currentCategory);
    }
    if (searchTerm) {
      filtered = filtered.filter(ch => 
        ch.name.toLowerCase().includes(searchTerm) || 
        (ch.category && ch.category.toLowerCase().includes(searchTerm))
      );
    }
    filteredChannels = filtered;
    renderChannels(filteredChannels);
  }
  
  // ========== FETCH FROM GITHUB ==========
  async function loadChannels() {
    loadingEl.style.display = 'block';
    errorEl.style.display = 'none';
    const jsonUrl = 'https://raw.githubusercontent.com/Joker7263/Nba-live/refs/heads/main/all%20channel.json';
    try {
      const res = await fetch(jsonUrl);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data && Array.isArray(data.channels)) {
        allChannels = data.channels.map(ch => ({
          ...ch,
          category: ch.category || 'Entertainment',
          streamUrl: ch.streamUrl || ''
        }));
        updateFilters();
        applyFilterAndSearch();
        loadingEl.style.display = 'none';
        showToast(`✅ Loaded ${allChannels.length} channels`, 2000);
      } else {
        throw new Error('Invalid JSON format');
      }
    } catch (err) {
      loadingEl.style.display = 'none';
      errorEl.style.display = 'block';
      errorEl.innerHTML = `❌ Failed to load: ${err.message}<br><button onclick="location.reload()" style="margin-top:10px;padding:8px 20px;background:#3b4b6e;border:none;border-radius:24px;color:white;cursor:pointer;">Retry</button>`;
    }
  }
  
  // ========== SEARCH ==========
  const searchInput = document.getElementById('search-input');
  const searchBtn = document.getElementById('search-btn');
  const clearBtn = document.getElementById('clear-btn');
  
  searchBtn.onclick = () => applyFilterAndSearch();
  searchInput.oninput = () => {
    clearBtn.style.display = searchInput.value ? 'flex' : 'none';
    applyFilterAndSearch();
  };
  clearBtn.onclick = () => {
    searchInput.value = '';
    clearBtn.style.display = 'none';
    applyFilterAndSearch();
  };
  closePlayerBtn.onclick = closePlayer;
  
  // ESC to close
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && playerOverlay.style.display === 'flex') closePlayer();
  });
  
  loadChannels();
</script>
</body>
</html>
