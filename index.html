  <style>
    * { box-sizing: border-box; }
    :root {
      --accent: #61dafb;
      --accent-glow: rgba(97,218,251,0.4);
      --bg: #0a0c10;
      --card-bg: #1c212a;
      --glass: rgba(255,255,255,0.05);
      --text-dim: #a0a0a0;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: white;
      overflow: hidden;
      height: 100vh;
    }
    #video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: black;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #audio-fallback {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 2;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0a0c10, #030405);
    }
    #audio-fallback h2 { font-size: 2rem; margin: 0; }
    #audio-fallback p { color: var(--accent); font-size: 1.2rem; }
    #ui-layer {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: radial-gradient(circle at 20% 30%, rgba(10,12,16,0.94) 0%, rgba(10,12,16,0.98) 100%);
      backdrop-filter: blur(2px);
      transition: opacity 0.3s ease, visibility 0.3s;
      padding: 20px 30px;
    }
    #ui-layer.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      color: var(--text-dim);
    }
    #channel-count {
      background: var(--glass);
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.85rem;
    }
    #clock {
      background: var(--glass);
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.85rem;
    }
    #search-section {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    #search-box {
      width: 70%;
      max-width: 500px;
      background: rgba(20,25,35,0.9);
      border: 2px solid #2a2f3a;
      border-radius: 60px;
      padding: 12px 24px;
      color: white;
      font-size: 1rem;
      outline: none;
      text-align: center;
    }
    #search-box:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    #channel-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 18px;
      overflow-y: auto;
      padding: 10px 5px 20px 5px;
      align-content: start;
    }
    #channel-grid::-webkit-scrollbar { width: 5px; }
    #channel-grid::-webkit-scrollbar-track { background: #1a1f28; border-radius: 8px; }
    #channel-grid::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 8px; }
    .channel-card {
      background: var(--card-bg);
      padding: 16px 10px;
      border-radius: 20px;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s, background 0.2s;
    }
    .channel-card.filtered-out { display: none; }
    .channel-card:focus-visible {
      border-color: var(--accent);
      transform: scale(1.02);
      background: #2a313e;
    }
    .channel-card:hover {
      background: #252d3a;
      transform: translateY(-3px);
    }
    .logo-box {
      width: 70px;
      height: 70px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.25);
      border-radius: 18px;
    }
    .channel-card img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }
    .letter-fallback {
      font-size: 2rem;
      font-weight: bold;
      color: var(--accent);
    }
    .channel-card span {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .custom-card {
      background: linear-gradient(135deg, #2b2f3a, #1e222b);
      border: 1px solid rgba(255,215,0,0.3);
    }
    #loader {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 200;
      display: none;
      background: rgba(0,0,0,0.8);
      padding: 20px;
      border-radius: 60px;
    }
    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #2a2f3a;
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .error-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #dc2626;
      color: white;
      padding: 10px 20px;
      border-radius: 40px;
      font-size: 0.85rem;
      z-index: 300;
      display: none;
    }
    .youtube-badge {
      font-size: 0.7rem;
      background: #ff0000;
      border-radius: 12px;
      padding: 2px 8px;
      margin-top: 5px;
      display: inline-block;
    }
  </style>
</head>

    if (show) {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      uiLayer.classList.remove('hidden');
      setTimeout(() => {
        const target = (lastFocused && document.body.contains(lastFocused)) ? lastFocused : searchBox;
        target?.focus();
      }, 50);
    } else {
      uiLayer.classList.add('hidden');
    }

  async function initShaka() {
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) {
      alert("Browser not supported");
      return false;
    }
    player = new shaka.Player(video);
    ui = new shaka.ui.Overlay(player, container, video);
    ui.configure({
      controlPanelElements: ['play_pause', 'time_and_duration', 'spacer', 'quality', 'fullscreen'],
      overflowMenuButtons: ['quality']
    });
    player.addEventListener('loaded', () => {
      fallbackDiv.style.display = player.isAudioOnly() ? 'flex' : 'none';
    });
    return true;
  }

    toggleUI(false);
    fallbackDiv.style.display = 'none';
    loader.style.display = 'block';
    fallbackName.textContent = channel.name;

    try {
      if (channel.type === 'youtube') {
        loader.style.display = 'none';
        const confirmOpen = confirm(`"${channel.name}" is a YouTube live stream. Open in YouTube?`);
        if (confirmOpen) window.open(channel.streamUrl, '_blank');
        toggleUI(true);
        return;
      }

      await player.load(channel.streamUrl);
      if (container.requestFullscreen) await container.requestFullscreen();
    } catch (err) {
      console.error(`Failed: ${channel.name}`, err);
      showToast(`"${channel.name}" - Stream unavailable`);
      toggleUI(true);
    } finally {
      loader.style.display = 'none';
    }
  }

  function renderChannels() {
    grid.innerHTML = '';
    
    const kofi = document.createElement('div');
    kofi.className = 'channel-card custom-card';
    kofi.tabIndex = 0;
    kofi.innerHTML = `<div class="logo-box"><div class="letter-fallback">❤️</div></div><span>Support on Ko-fi</span>`;
    kofi.onclick = () => window.open('https://ko-fi.com/acevin', '_blank');
    kofi.onkeydown = (e) => e.key === 'Enter' && kofi.onclick();
    grid.appendChild(kofi);

    WORKING_CHANNELS.forEach(ch => {
      const card = document.createElement('div');
      card.className = 'channel-card';
      card.tabIndex = 0;
      card.setAttribute('data-name', ch.name.toLowerCase());
      const letter = ch.name.charAt(0).toUpperCase();
      const badge = ch.type === 'youtube' ? '<span class="youtube-badge">▶ YouTube</span>' : '';
      card.innerHTML = `
        <div class="logo-box">
          <div class="letter-fallback">${letter}</div>
        </div>
        <span>${ch.name}</span>
        ${badge}
      `;
      card.onclick = async () => {
        lastFocused = card;
        await playChannel(ch);
      };
      card.onkeydown = (e) => e.key === 'Enter' && card.onclick();
      grid.appendChild(card);
    });
    
    document.getElementById('channel-count').innerHTML = `📺 ${WORKING_CHANNELS.length} Channels`;
  }

  function handleSearch(val) {
    const q = val.toLowerCase();
    const cards = Array.from(grid.querySelectorAll('.channel-card:not(.custom-card)'));
    cards.forEach(card => {
      const name = card.getAttribute('data-name') || '';
      card.classList.toggle('filtered-out', !name.includes(q));
    });
    const visible = cards.filter(c => !c.classList.contains('filtered-out')).length;
    document.getElementById('channel-count').innerHTML = `📺 ${visible}/${WORKING_CHANNELS.length} Channels`;
  }

  function startClock() {
    const update = () => {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    };
    update();
    setInterval(update, 1000);
  }

  function setupNav() {
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !uiLayer.classList.contains('hidden')) {
        // do nothing, escape doesn't hide UI in this version
      }
      if (uiLayer.classList.contains('hidden')) return;
      const active = document.activeElement;
      const allCards = Array.from(grid.querySelectorAll('.channel-card:not(.filtered-out)'));
      if (active === searchBox && e.key === 'ArrowDown' && allCards.length) {
        e.preventDefault();
        allCards[0].focus();
      } else if (active?.classList?.contains('channel-card')) {
        const idx = allCards.indexOf(active);
        if (e.key === 'ArrowLeft' && idx > 0) allCards[idx-1].focus();
        else if (e.key === 'ArrowRight' && idx < allCards.length-1) allCards[idx+1].focus();
      }
    });
    searchBox.addEventListener('input', (e) => handleSearch(e.target.value));
  }

  (async () => {
    await initShaka();
    renderChannels();
    toggleUI(true);
    setupNav();
    startClock();
  })();
</script>
</body>
</html>
