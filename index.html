<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TVPass PH Clone - DRM Live TV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #222;
        }

        .logo h1 {
            font-size: 28px;
            background: linear-gradient(45deg, #e65c00, #ff9a44);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo p {
            font-size: 12px;
            color: #666;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: #888;
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #e65c00;
        }

        .donate-btn {
            background: #e65c00;
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
        }

        /* Featured Section */
        .featured-section {
            margin-bottom: 40px;
        }

        .featured-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid #2a2a3e;
        }

        .featured-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-color: #e65c00;
        }

        .featured-info {
            flex: 1;
            padding: 30px;
            min-width: 250px;
        }

        .featured-badge {
            background: #e65c00;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .featured-info h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .featured-info p {
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .watch-btn {
            background: #e65c00;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .watch-btn:hover {
            background: #ff7700;
        }

        .featured-image {
            width: 200px;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }

        /* Section Header */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0 20px;
        }

        .section-header h3 {
            font-size: 20px;
        }

        .view-all {
            color: #e65c00;
            text-decoration: none;
            font-size: 14px;
        }

        /* Channel Grid */
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .channel-card {
            background: #111216;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            border: 1px solid #222;
        }

        .channel-card:hover {
            transform: translateY(-3px);
            border-color: #e65c00;
        }

        .channel-card.active {
            border-color: #e65c00;
            background: #1a1a2e;
        }

        .channel-thumb {
            height: 160px;
            background: #1a1a22;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            position: relative;
        }

        .live-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #e74c3c;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }

        .drm-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            color: #ff9800;
        }

        .channel-info {
            padding: 15px;
        }

        .channel-info h4 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .channel-category {
            font-size: 12px;
            color: #888;
        }

        /* Video Player Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            flex-direction: column;
        }

        .modal.active {
            display: flex;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #111;
            border-bottom: 1px solid #333;
        }

        .modal-header h3 {
            font-size: 18px;
        }

        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            padding: 0 10px;
        }

        .video-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #modalVideo {
            width: 100%;
            height: 100%;
            max-height: 90vh;
            object-fit: contain;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #333;
            border-top-color: #e65c00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-msg {
            background: #e74c3c;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }

        /* Search Bar */
        .search-bar {
            margin-bottom: 30px;
        }

        .search-bar input {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            background: #1a1a22;
            border: 1px solid #333;
            border-radius: 30px;
            color: white;
            font-size: 14px;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #e65c00;
        }

        /* Footer */
        .footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid #222;
            text-align: center;
            color: #666;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            .featured-info h2 {
                font-size: 20px;
            }
            .channels-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <h1>📺 TVPass PH</h1>
                <p>DRM Live TV Streaming</p>
            </div>
            <div class="nav-links">
                <a href="#">Live channels</a>
                <a href="#" class="donate-btn">DONATE</a>
            </div>
        </div>

        <!-- Featured Section -->
        <div class="featured-section" id="featuredSection">
            <!-- Dynamic featured content -->
        </div>

        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search channels...">
        </div>

        <!-- Most Viewed Section -->
        <div class="section-header">
            <h3>⭐ Most viewed</h3>
            <a href="#" class="view-all">View all →</a>
        </div>
        <div class="channels-grid" id="mostViewedGrid">
            <!-- Most viewed channels -->
        </div>

        <!-- All Channels Section -->
        <div class="section-header">
            <h3>📡 All channels</h3>
        </div>
        <div class="channels-grid" id="allChannelsGrid">
            <div style="text-align:center; padding:50px;">Loading channels...</div>
        </div>

        <div class="footer">
            <p>© 2026 TVPass PH - DRM Live TV Streaming | All streams are property of their respective owners</p>
        </div>
    </div>

    <!-- Video Modal -->
    <div class="modal" id="videoModal">
        <div class="modal-header">
            <h3 id="modalChannelName">Now Playing</h3>
            <button class="close-modal" id="closeModalBtn">×</button>
        </div>
        <div class="video-wrapper">
            <video id="modalVideo" controls autoplay playsinline></video>
            <div class="loading-overlay" id="modalLoading" style="display: none;">
                <div class="loading-spinner"></div>
                <span>Loading stream...</span>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // TVPASS PH CLONE - FULL WORKING CODE
        // ============================================
        
        const GITHUB_JSON_URL = "https://raw.githubusercontent.com/Joker7263/Nba-live/refs/heads/main/all%20channel.json";
        
        let channels = [];
        let currentChannel = null;
        let currentVideoElement = null;
        
        // Helper: Get stream URL (with fallback)
        function getStreamUrl(channel) {
            if (!channel) return '';
            let url = channel.streamUrl || '';
            
            if ((!url || url.includes('xxip9.top') || url.includes('kstv.us')) && 
                channel.standbyUrls && channel.standbyUrls.length > 0) {
                return channel.standbyUrls[0];
            }
            return url;
        }
        
        // Helper: Check if channel has DRM
        function hasDrm(channel) {
            return channel.drm && Object.keys(channel.drm).length > 0;
        }
        
        // Helper: Get channel logo emoji
        function getChannelEmoji(name, category) {
            const map = {
                'NBA': '🏀', 'Sports': '⚽', 'Movies': '🎬', 'News': '📰',
                'GMA': '📺', 'TV5': '📡', 'ABS': '⭐', 'HBO': '🎬',
                'Cinema': '🍿', 'Kapatid': '🔴', 'Music': '🎵', 'Kids': '🧸'
            };
            for (let [key, emoji] of Object.entries(map)) {
                if (name.includes(key)) return emoji;
            }
            if (category === 'Sports') return '⚽';
            if (category === 'Movies') return '🎬';
            return '📺';
        }
        
        // Escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
        }
        
        // Render featured section (using top5 if available)
        function renderFeatured() {
            const featuredContainer = document.getElementById('featuredSection');
            if (!featuredContainer || channels.length === 0) return;
            
            // Try to get featured channel from top5 or use first channel
            let featuredChannel = channels[0];
            
            featuredContainer.innerHTML = `
                <div class="featured-card" data-channel-index="0">
                    <div class="featured-info">
                        <span class="featured-badge">⭐ FEATURED STREAM</span>
                        <h2>${escapeHtml(featuredChannel.name)}</h2>
                        <p>${escapeHtml(featuredChannel.category || 'Entertainment')} channel with live streaming. Watch now on TVPass PH.</p>
                        <button class="watch-btn">▶ Watch now</button>
                    </div>
                    <div class="featured-image">
                        ${getChannelEmoji(featuredChannel.name, featuredChannel.category)}
                    </div>
                </div>
            `;
            
            const featuredCard = featuredContainer.querySelector('.featured-card');
            if (featuredCard) {
                featuredCard.addEventListener('click', () => openPlayer(0));
            }
        }
        
        // Render most viewed (first 5 channels)
        function renderMostViewed() {
            const container = document.getElementById('mostViewedGrid');
            if (!container || channels.length === 0) return;
            
            const mostViewed = channels.slice(0, 5);
            container.innerHTML = mostViewed.map((channel, idx) => `
                <div class="channel-card" data-channel-index="${idx}">
                    <div class="channel-thumb">
                        <span class="live-indicator">LIVE</span>
                        ${hasDrm(channel) ? '<span class="drm-badge">🔒 DRM</span>' : ''}
                        <span style="font-size:48px;">${getChannelEmoji(channel.name, channel.category)}</span>
                    </div>
                    <div class="channel-info">
                        <h4>${escapeHtml(channel.name)}</h4>
                        <div class="channel-category">${escapeHtml(channel.category || 'Entertainment')}</div>
                    </div>
                </div>
            `).join('');
            
            // Add click handlers
            document.querySelectorAll('#mostViewedGrid .channel-card').forEach(card => {
                card.addEventListener('click', () => {
                    const idx = parseInt(card.dataset.channelIndex);
                    openPlayer(idx);
                });
            });
        }
        
        // Render all channels
        function renderAllChannels(searchTerm = '') {
            const container = document.getElementById('allChannelsGrid');
            if (!container) return;
            
            let filtered = channels;
            if (searchTerm) {
                filtered = channels.filter(ch => 
                    ch.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    (ch.category && ch.category.toLowerCase().includes(searchTerm.toLowerCase()))
                );
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:50px; color:#888;">No channels found</div>';
                return;
            }
            
            container.innerHTML = filtered.map((channel, idx) => {
                const originalIdx = channels.findIndex(c => c.name === channel.name);
                return `
                    <div class="channel-card" data-channel-index="${originalIdx}">
                        <div class="channel-thumb">
                            <span class="live-indicator">LIVE</span>
                            ${hasDrm(channel) ? '<span class="drm-badge">🔒 DRM</span>' : ''}
                            <span style="font-size:48px;">${getChannelEmoji(channel.name, channel.category)}</span>
                        </div>
                        <div class="channel-info">
                            <h4>${escapeHtml(channel.name)}</h4>
                            <div class="channel-category">${escapeHtml(channel.category || 'Entertainment')}</div>
                        </div>
                    </div>
                `;
            }).join('');
            
            // Add click handlers
            document.querySelectorAll('#allChannelsGrid .channel-card').forEach(card => {
                card.addEventListener('click', () => {
                    const idx = parseInt(card.dataset.channelIndex);
                    openPlayer(idx);
                });
            });
        }
        
        // Open video player with channel
        async function openPlayer(index) {
            if (index < 0 || index >= channels.length) return;
            
            currentChannel = channels[index];
            const streamUrl = getStreamUrl(currentChannel);
            const hasDRM = hasDrm(currentChannel);
            const drmKeys = hasDRM ? currentChannel.drm : null;
            
            if (!streamUrl) {
                alert(`No stream URL available for ${currentChannel.name}`);
                return;
            }
            
            // Show modal
            const modal = document.getElementById('videoModal');
            const modalChannelName = document.getElementById('modalChannelName');
            const video = document.getElementById('modalVideo');
            const loading = document.getElementById('modalLoading');
            
            modalChannelName.innerText = `${currentChannel.name} ${hasDRM ? '(DRM Protected)' : ''}`;
            modal.classList.add('active');
            loading.style.display = 'flex';
            
            // Stop current playback
            video.pause();
            video.removeAttribute('src');
            video.load();
            
            // For DRM streams, try to use Shaka Player if available, otherwise fallback
            if (hasDRM && drmKeys) {
                await playWithShaka(video, streamUrl, drmKeys, loading);
            } else {
                await playWithNative(video, streamUrl, loading);
            }
        }
        
        // Play DRM stream with Shaka Player
        async function playWithShaka(videoElement, streamUrl, drmKeys, loadingElement) {
            // Check if Shaka is available
            if (typeof shaka === 'undefined') {
                loadingElement.style.display = 'none';
                showNativeFallback(videoElement, streamUrl, loadingElement, true);
                return;
            }
            
            try {
                // Destroy existing player if any
                if (window.shakaPlayer) {
                    window.shakaPlayer.destroy();
                    window.shakaPlayer = null;
                }
                
                // Create new Shaka player
                const player = new shaka.Player(videoElement);
                window.shakaPlayer = player;
                
                // Configure DRM for ClearKey
                const clearkeys = {};
                for (const [kid, key] of Object.entries(drmKeys)) {
                    clearkeys[kid] = key;
                }
                
                await player.configure({
                    drm: {
                        clearkey: {
                            keyIds: Object.keys(clearkeys),
                            clearkeys: clearkeys
                        }
                    }
                });
                
                // Load stream
                await player.load(streamUrl);
                loadingElement.style.display = 'none';
                videoElement.play().catch(e => console.log('Autoplay prevented:', e));
                
                player.addEventListener('error', (event) => {
                    console.error('Shaka error:', event.detail);
                    loadingElement.style.display = 'none';
                    showNativeFallback(videoElement, streamUrl, loadingElement, true);
                });
                
            } catch (error) {
                console.error('Shaka playback error:', error);
                loadingElement.style.display = 'none';
                showNativeFallback(videoElement, streamUrl, loadingElement, true);
            }
        }
        
        // Play non-DRM stream natively
        async function playWithNative(videoElement, streamUrl, loadingElement) {
            videoElement.src = streamUrl;
            videoElement.load();
            
            videoElement.oncanplay = () => {
                loadingElement.style.display = 'none';
                videoElement.play().catch(e => console.log('Autoplay prevented:', e));
            };
            
            videoElement.onerror = () => {
                loadingElement.style.display = 'none';
                alert('Failed to play stream. The stream may be offline or expired.');
            };
            
            // Timeout after 10 seconds
            setTimeout(() => {
                if (loadingElement.style.display !== 'none') {
                    loadingElement.style.display = 'none';
                    alert('Stream loading timeout. Please try again later.');
                }
            }, 10000);
        }
        
        // Fallback for DRM streams (show download option)
        function showNativeFallback(videoElement, streamUrl, loadingElement, hasDRM) {
            loadingElement.style.display = 'none';
            
            if (hasDRM) {
                // For DRM streams, show message and offer M3U download
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-msg';
                errorDiv.innerHTML = `
                    ⚠️ DRM-protected stream cannot be played directly in browser.<br>
                    <button id="downloadM3UFallback" style="margin-top:10px; background:#ff9800; border:none; padding:8px 16px; border-radius:6px; cursor:pointer;">📥 Download .m3u file for KODI/VLC</button>
                `;
                
                const videoWrapper = document.querySelector('.video-wrapper');
                const existingError = videoWrapper.querySelector('.error-msg');
                if (existingError) existingError.remove();
                videoWrapper.appendChild(errorDiv);
                
                document.getElementById('downloadM3UFallback')?.addEventListener('click', () => {
                    downloadM3uForChannel(currentChannel);
                });
            } else {
                alert('Failed to play stream. The stream may be offline.');
            }
        }
        
        // Download M3U for external player
        function downloadM3uForChannel(channel) {
            if (!channel) return;
            const streamUrl = getStreamUrl(channel);
            let m3uContent = '#EXTM3U\n';
            m3uContent += `#EXTINF:-1 group-title="${channel.category || 'Entertainment'}" ${channel.name}\n${streamUrl}\n`;
            if (channel.drm) {
                m3uContent += `#DRM-KEYS: ${JSON.stringify(channel.drm)}\n`;
            }
            const blob = new Blob([m3uContent], { type: 'audio/x-mpegurl' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${channel.name.replace(/[^a-z0-9]/gi, '_')}.m3u`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // Close modal
        function closeModal() {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('modalVideo');
            modal.classList.remove('active');
            video.pause();
            video.removeAttribute('src');
            video.load();
            if (window.shakaPlayer) {
                window.shakaPlayer.destroy();
                window.shakaPlayer = null;
            }
            // Remove error messages
            const errorDiv = document.querySelector('.video-wrapper .error-msg');
            if (errorDiv) errorDiv.remove();
        }
        
        // Load channels from GitHub
        async function loadChannels() {
            try {
                const response = await fetch(GITHUB_JSON_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                channels = data.channels || [];
                
                if (channels.length === 0) throw new Error('No channels found');
                
                renderFeatured();
                renderMostViewed();
                renderAllChannels();
                
            } catch (error) {
                document.getElementById('allChannelsGrid').innerHTML = `<div class="error-msg" style="margin:20px;">⚠️ Failed to load channels: ${error.message}<br><br>Make sure the JSON URL is accessible: <a href="${GITHUB_JSON_URL}" target="_blank" style="color:#ff9800;">${GITHUB_JSON_URL}</a></div>`;
                console.error(error);
            }
        }
        
        // Search functionality
        document.getElementById('searchInput')?.addEventListener('input', (e) => {
            renderAllChannels(e.target.value);
        });
        
        // Modal close
        document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
        document.getElementById('videoModal')?.addEventListener('click', (e) => {
            if (e.target === document.getElementById('videoModal')) closeModal();
        });
        
        // Start loading
        loadChannels();
        
        // Load Shaka Player dynamically (to avoid load errors)
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/shaka-player@4.11.2/dist/shaka-player.compiled.js';
        script.onload = () => {
            console.log('Shaka Player loaded successfully');
        };
        script.onerror = () => {
            console.log('Shaka Player failed to load - DRM streams will use fallback');
        };
        document.head.appendChild(script);
    </script>
</body>
</html>
