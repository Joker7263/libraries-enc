<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TVPass PH - DRM Live TV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #222;
        }

        .logo h1 {
            font-size: 28px;
            background: linear-gradient(45deg, #e65c00, #ff9a44);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo p {
            font-size: 12px;
            color: #666;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: #888;
            text-decoration: none;
        }

        .donate-btn {
            background: #e65c00;
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
        }

        /* Featured Section */
        .featured-section {
            margin-bottom: 40px;
        }

        .featured-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
            cursor: pointer;
            border: 1px solid #2a2a3e;
            transition: transform 0.2s;
        }

        .featured-card:hover {
            transform: translateY(-3px);
            border-color: #e65c00;
        }

        .featured-info {
            flex: 1;
            padding: 30px;
        }

        .featured-badge {
            background: #e65c00;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .featured-info h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .featured-info p {
            color: #aaa;
            margin-bottom: 20px;
        }

        .watch-btn {
            background: #e65c00;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
        }

        .featured-image {
            width: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            background: #1a1a2e;
        }

        /* Section Header */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0 20px;
        }

        .section-header h3 {
            font-size: 20px;
        }

        /* Search Bar */
        .search-bar {
            margin-bottom: 30px;
        }

        .search-bar input {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            background: #1a1a22;
            border: 1px solid #333;
            border-radius: 30px;
            color: white;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #e65c00;
        }

        /* Channel Grid */
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .channel-card {
            background: #111216;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #222;
            transition: transform 0.2s;
        }

        .channel-card:hover {
            transform: translateY(-3px);
            border-color: #e65c00;
        }

        .channel-thumb {
            height: 160px;
            background: #1a1a22;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            position: relative;
        }

        .live-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #e74c3c;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
        }

        .drm-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            color: #ff9800;
        }

        .channel-info {
            padding: 15px;
        }

        .channel-info h4 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .channel-category {
            font-size: 12px;
            color: #888;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            flex-direction: column;
        }

        .modal.active {
            display: flex;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #111;
            border-bottom: 1px solid #333;
        }

        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }

        .video-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
        }

        #modalVideo {
            width: 100%;
            height: 100%;
            max-height: 90vh;
            object-fit: contain;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #333;
            border-top-color: #e65c00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-msg {
            background: #e74c3c;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin: 20px;
        }

        .footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid #222;
            text-align: center;
            color: #666;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .container { padding: 15px; }
            .featured-info h2 { font-size: 20px; }
            .featured-image { width: 120px; font-size: 50px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <h1>📺 TVPass PH</h1>
                <p>DRM Live TV Streaming</p>
            </div>
            <div class="nav-links">
                <a href="#">Live channels</a>
                <a href="#" class="donate-btn">DONATE</a>
            </div>
        </div>

        <div class="featured-section" id="featuredSection"></div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search channels...">
        </div>

        <div class="section-header">
            <h3>⭐ Most viewed</h3>
        </div>
        <div class="channels-grid" id="mostViewedGrid"></div>

        <div class="section-header">
            <h3>📡 All channels</h3>
        </div>
        <div class="channels-grid" id="allChannelsGrid"></div>

        <div class="footer">
            <p>© 2026 TVPass PH - All streams are property of their respective owners</p>
        </div>
    </div>

    <div class="modal" id="videoModal">
        <div class="modal-header">
            <h3 id="modalChannelName">Now Playing</h3>
            <button class="close-modal" id="closeModalBtn">×</button>
        </div>
        <div class="video-wrapper">
            <video id="modalVideo" controls autoplay playsinline></video>
            <div class="loading-overlay" id="modalLoading" style="display: none;">
                <div class="loading-spinner"></div>
                <span>Loading stream...</span>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // FIXED: Using GitHub API instead of raw URL
        // ============================================
        
        // Use GitHub API to avoid CORS issues
        const GITHUB_API_URL = "https://api.github.com/repos/Joker7263/Nba-live/contents/all%20channel.json";
        
        let channels = [];
        let currentChannel = null;
        
        // Helper functions
        function getStreamUrl(channel) {
            if (!channel) return '';
            let url = channel.streamUrl || '';
            if ((!url || url.includes('xxip9.top') || url.includes('kstv.us')) && 
                channel.standbyUrls && channel.standbyUrls.length > 0) {
                return channel.standbyUrls[0];
            }
            return url;
        }
        
        function hasDrm(channel) {
            return channel.drm && Object.keys(channel.drm).length > 0;
        }
        
        function getChannelEmoji(name, category) {
            const map = {
                'NBA': '🏀', 'Sports': '⚽', 'Movies': '🎬', 'News': '📰',
                'GMA': '📺', 'TV5': '📡', 'ABS': '⭐', 'HBO': '🎬',
                'Cinema': '🍿', 'Kapatid': '🔴'
            };
            for (let [key, emoji] of Object.entries(map)) {
                if (name.includes(key)) return emoji;
            }
            if (category === 'Sports') return '⚽';
            if (category === 'Movies') return '🎬';
            return '📺';
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
        }
        
        // Fetch channels from GitHub API (bypasses CORS)
        async function fetchChannels() {
            try {
                // First try GitHub API
                const response = await fetch(GITHUB_API_URL);
                if (response.ok) {
                    const data = await response.json();
                    const content = atob(data.content);
                    const jsonData = JSON.parse(content);
                    channels = jsonData.channels || [];
                } else {
                    // Fallback: Try raw URL with cors proxy
                    const proxyUrl = "https://cors-anywhere.herokuapp.com/";
                    const rawUrl = "https://raw.githubusercontent.com/Joker7263/Nba-live/refs/heads/main/all%20channel.json";
                    const fallbackResponse = await fetch(proxyUrl + rawUrl);
                    if (fallbackResponse.ok) {
                        const jsonData = await fallbackResponse.json();
                        channels = jsonData.channels || [];
                    } else {
                        throw new Error("Cannot fetch channels");
                    }
                }
                
                if (channels.length === 0) throw new Error("No channels found");
                
                renderFeatured();
                renderMostViewed();
                renderAllChannels();
                
            } catch (error) {
                console.error("Fetch error:", error);
                document.getElementById('allChannelsGrid').innerHTML = `
                    <div class="error-msg">
                        ⚠️ Failed to load channels: ${error.message}<br><br>
                        <button onclick="location.reload()" style="background:#e65c00; border:none; padding:8px 16px; border-radius:6px; color:white; cursor:pointer;">⟳ Retry</button>
                    </div>
                `;
            }
        }
        
        function renderFeatured() {
            const container = document.getElementById('featuredSection');
            if (!container || channels.length === 0) return;
            
            const channel = channels[0];
            container.innerHTML = `
                <div class="featured-card" data-channel-index="0">
                    <div class="featured-info">
                        <span class="featured-badge">⭐ FEATURED STREAM</span>
                        <h2>${escapeHtml(channel.name)}</h2>
                        <p>${escapeHtml(channel.category || 'Entertainment')} channel - Watch live now!</p>
                        <button class="watch-btn">▶ Watch now</button>
                    </div>
                    <div class="featured-image">${getChannelEmoji(channel.name, channel.category)}</div>
                </div>
            `;
            container.querySelector('.featured-card')?.addEventListener('click', () => openPlayer(0));
        }
        
        function renderMostViewed() {
            const container = document.getElementById('mostViewedGrid');
            if (!container || channels.length === 0) return;
            
            const top5 = channels.slice(0, 5);
            container.innerHTML = top5.map((channel, idx) => `
                <div class="channel-card" data-channel-index="${idx}">
                    <div class="channel-thumb">
                        <span class="live-indicator">LIVE</span>
                        ${hasDrm(channel) ? '<span class="drm-badge">🔒 DRM</span>' : ''}
                        <span>${getChannelEmoji(channel.name, channel.category)}</span>
                    </div>
                    <div class="channel-info">
                        <h4>${escapeHtml(channel.name)}</h4>
                        <div class="channel-category">${escapeHtml(channel.category || 'Entertainment')}</div>
                    </div>
                </div>
            `).join('');
            
            document.querySelectorAll('#mostViewedGrid .channel-card').forEach(card => {
                card.addEventListener('click', () => {
                    const idx = parseInt(card.dataset.channelIndex);
                    openPlayer(idx);
                });
            });
        }
        
        function renderAllChannels(searchTerm = '') {
            const container = document.getElementById('allChannelsGrid');
            if (!container) return;
            
            let filtered = channels;
            if (searchTerm) {
                filtered = channels.filter(ch => 
                    ch.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    (ch.category && ch.category.toLowerCase().includes(searchTerm.toLowerCase()))
                );
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:50px; color:#888;">No channels found</div>';
                return;
            }
            
            container.innerHTML = filtered.map((channel, i) => {
                const originalIdx = channels.findIndex(c => c.name === channel.name);
                return `
                    <div class="channel-card" data-channel-index="${originalIdx}">
                        <div class="channel-thumb">
                            <span class="live-indicator">LIVE</span>
                            ${hasDrm(channel) ? '<span class="drm-badge">🔒 DRM</span>' : ''}
                            <span>${getChannelEmoji(channel.name, channel.category)}</span>
                        </div>
                        <div class="channel-info">
                            <h4>${escapeHtml(channel.name)}</h4>
                            <div class="channel-category">${escapeHtml(channel.category || 'Entertainment')}</div>
                        </div>
                    </div>
                `;
            }).join('');
            
            document.querySelectorAll('#allChannelsGrid .channel-card').forEach(card => {
                card.addEventListener('click', () => {
                    const idx = parseInt(card.dataset.channelIndex);
                    openPlayer(idx);
                });
            });
        }
        
        function openPlayer(index) {
            if (index < 0 || index >= channels.length) return;
            
            currentChannel = channels[index];
            const streamUrl = getStreamUrl(currentChannel);
            const hasDRM = hasDrm(currentChannel);
            
            if (!streamUrl) {
                alert(`No stream URL for ${currentChannel.name}`);
                return;
            }
            
            const modal = document.getElementById('videoModal');
            const modalTitle = document.getElementById('modalChannelName');
            const video = document.getElementById('modalVideo');
            const loading = document.getElementById('modalLoading');
            
            modalTitle.innerText = `${currentChannel.name} ${hasDRM ? '(DRM - Use VLC/KODI)' : ''}`;
            modal.classList.add('active');
            loading.style.display = 'flex';
            
            video.pause();
            video.removeAttribute('src');
            video.load();
            
            // For DRM or non-DRM, try native playback first
            video.src = streamUrl;
            video.load();
            
            video.oncanplay = () => {
                loading.style.display = 'none';
                video.play().catch(e => console.log('Autoplay blocked:', e));
            };
            
            video.onerror = () => {
                loading.style.display = 'none';
                if (hasDRM) {
                    // Offer M3U download for DRM streams
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'error-msg';
                    errorDiv.style.position = 'absolute';
                    errorDiv.style.bottom = '20px';
                    errorDiv.style.left = '20px';
                    errorDiv.style.right = '20px';
                    errorDiv.innerHTML = `
                        ⚠️ DRM-protected stream cannot be played in browser.<br>
                        <button id="downloadM3UFallback" style="margin-top:10px; background:#ff9800; border:none; padding:8px 16px; border-radius:6px; cursor:pointer;">📥 Download .m3u for KODI/VLC</button>
                    `;
                    const wrapper = document.querySelector('.video-wrapper');
                    const oldError = wrapper.querySelector('.error-msg');
                    if (oldError) oldError.remove();
                    wrapper.appendChild(errorDiv);
                    
                    document.getElementById('downloadM3UFallback')?.addEventListener('click', () => {
                        let m3u = '#EXTM3U\n';
                        m3u += `#EXTINF:-1 ${currentChannel.name}\n${streamUrl}\n`;
                        if (currentChannel.drm) {
                            m3u += `#DRM-KEYS: ${JSON.stringify(currentChannel.drm)}\n`;
                        }
                        const blob = new Blob([m3u], { type: 'audio/x-mpegurl' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `${currentChannel.name.replace(/[^a-z0-9]/gi, '_')}.m3u`;
                        a.click();
                        URL.revokeObjectURL(url);
                    });
                } else {
                    alert('Failed to play stream. The stream may be offline.');
                }
            };
            
            setTimeout(() => {
                if (loading.style.display !== 'none') {
                    loading.style.display = 'none';
                    if (!hasDRM) alert('Stream loading timeout.');
                }
            }, 15000);
        }
        
        function closeModal() {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('modalVideo');
            modal.classList.remove('active');
            video.pause();
            video.removeAttribute('src');
            video.load();
            const errorDiv = document.querySelector('.video-wrapper .error-msg');
            if (errorDiv) errorDiv.remove();
        }
        
        // Event listeners
        document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
        document.getElementById('videoModal')?.addEventListener('click', (e) => {
            if (e.target === document.getElementById('videoModal')) closeModal();
        });
        document.getElementById('searchInput')?.addEventListener('input', (e) => {
            renderAllChannels(e.target.value);
        });
        
        // Start
        fetchChannels();
    </script>
</body>
</html>
