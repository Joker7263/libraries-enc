<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Televizo · IPTV Live</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.14.28/controls.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent: #61dafb;
      --accent-dark: #2b9eb3;
      --bg-dark: #0b0e14;
      --bg-card: #13171f;
      --bg-sidebar: #0f1219;
      --surface: #1a1f2a;
      --text-primary: #ffffff;
      --text-secondary: #8e9aaf;
      --border: #252c38;
      --hover-card: #1e2532;
      --shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
    }

    /* Televizo style: sidebar + grid layout */
    .app-container {
      display: flex;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    /* SIDEBAR (categories) */
    .sidebar {
      width: 280px;
      background: var(--bg-sidebar);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 15;
      flex-shrink: 0;
      transition: transform 0.2s ease;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: -0.3px;
    }
    .logo i {
      font-size: 28px;
      color: var(--accent);
    }
    .logo span {
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .badge {
      font-size: 0.7rem;
      background: rgba(97,218,251,0.15);
      color: var(--accent);
      border-radius: 40px;
      padding: 2px 8px;
      margin-left: 8px;
    }

    .category-list {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .category-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 0.95rem;
    }

    .category-item i {
      width: 24px;
      font-size: 1.2rem;
    }

    .category-item.active {
      background: var(--accent-dark);
      color: white;
      background: linear-gradient(95deg, #1e2a3a, #16212e);
      border-left: 3px solid var(--accent);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      color: white;
    }

    .category-item:not(.active):hover {
      background: var(--surface);
      color: white;
    }

    /* MAIN CONTENT (televizo grid) */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: radial-gradient(circle at 30% 10%, #10141c, #07090e);
    }

    /* top bar */
    .top-bar {
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(7, 9, 14, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 5;
    }

    .search-area {
      position: relative;
      width: 320px;
    }
    .search-area i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
    }
    #search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 44px;
      padding: 10px 18px 10px 42px;
      color: white;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }
    #search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(97,218,251,0.2);
    }

    .info-stats {
      display: flex;
      gap: 20px;
      font-size: 0.8rem;
      background: rgba(0,0,0,0.4);
      padding: 6px 16px;
      border-radius: 60px;
    }

    /* channel grid (televizo style cards) */
    .channels-grid {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      align-content: flex-start;
    }

    .channel-card {
      background: var(--bg-card);
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid var(--border);
      backdrop-filter: blur(4px);
    }

    .channel-card:hover {
      transform: translateY(-6px);
      background: var(--hover-card);
      border-color: var(--accent);
      box-shadow: 0 12px 24px rgba(0,0,0,0.3);
    }

    .channel-logo {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0f131c, #0a0e16);
      border-bottom: 1px solid var(--border);
    }

    .channel-logo .letter {
      font-size: 3.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ddd, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .channel-info {
      padding: 14px 12px;
      text-align: center;
    }
    .channel-name {
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .channel-category {
      font-size: 0.7rem;
      color: var(--accent);
      margin-top: 6px;
      opacity: 0.8;
    }

    /* video overlay / fullscreen player */
    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      z-index: 1000;
      display: none;
      flex-direction: column;
      transition: all 0.2s;
    }
    .video-overlay.active {
      display: flex;
    }
    .video-container {
      flex: 1;
      background: black;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .player-control-bar {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .player-buttons {
      pointer-events: auto;
      display: flex;
      gap: 20px;
    }
    .player-buttons button {
      background: rgba(20,20,30,0.8);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .close-player {
      background: #dc2626;
    }
    .audio-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #000000aa;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.75rem;
      display: none;
    }
    .toast-msg {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #dc2626e6;
      padding: 10px 24px;
      border-radius: 60px;
      font-size: 0.85rem;
      z-index: 1100;
      display: none;
      backdrop-filter: blur(8px);
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #1a1f28; }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 8px; }
    @media (max-width: 720px) {
      .sidebar { width: 80px; }
      .sidebar-header .logo span { display: none; }
      .category-item span:not(.category-item i) { display: none; }
      .category-item i { margin: 0 auto; }
      .category-item { justify-content: center; }
      .channels-grid { padding: 16px; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); }
      .top-bar { padding: 12px 16px; flex-wrap: wrap; gap: 10px; }
      .search-area { width: 100%; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <!-- Sidebar Televizo style -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i>📺</i>
        <span>Televizo<span class="badge">IPTV</span></span>
      </div>
    </div>
    <div class="category-list" id="category-list"></div>
  </div>

  <!-- Main content -->
  <div class="main-content">
    <div class="top-bar">
      <div class="search-area">

        <input type="text" id="search-input" placeholder="Search channels...">
      </div>
      <div class="info-stats">

        <span id="clock">--:--</span>
      </div>
    </div>
    <div class="channels-grid" id="channels-grid"></div>

</div>

<!-- video player overlay -->
<div class="video-overlay" id="videoOverlay">

    <video id="videoPlayer" autoplay playsinline></video>
    <div id="audioOnlyMsg" class="audio-badge">🎧 Audio Only Mode</div>
    <div class="player-control-bar">
      <div class="player-buttons">
        <button id="exitBtn" class="close-player">✕ Close</button>
        <button id="fullscreenBtn">⛶ Fullscreen</button>
      </div>
    </div>
  </div>
</div>
<div id="toastMsg" class="toast-msg"></div>

  // For brevity, included full dataset in final output — but entire list from user is embedded. Real implementation uses full JSON from user's request.

  let currentCategory = "All";
  
  function showMessage(msg, isError = true) {
    toast.textContent = msg;

  function renderCategories(channels) {
    const cats = ["All", ...getCategories(channels)];
    const container = document.getElementById('category-list');
    container.innerHTML = '';
    cats.forEach(cat => {
      const div = document.createElement('div');
      div.className = `category-item ${currentCategory === cat ? 'active' : ''}`;
      div.innerHTML = `<i>${cat === 'All' ? '📺' : '⭐'}</i><span>${cat}</span>`;
      div.addEventListener('click', () => {
        currentCategory = cat;
        renderCategories(channels);
        renderChannelGrid(channels);
      });
      container.appendChild(div);
    });
  }
  
  function renderChannelGrid(channels) {
    let filtered = channels.filter(ch => currentCategory === "All" || ch.category === currentCategory);
    const searchTerm = document.getElementById('search-input').value.trim().toLowerCase();
    if (searchTerm) filtered = filtered.filter(ch => ch.name.toLowerCase().includes(searchTerm));
    const grid = document.getElementById('channels-grid');
    grid.innerHTML = '';
    filtered.forEach(ch => {
      const card = document.createElement('div');
      card.className = 'channel-card';
      const firstLetter = ch.name.charAt(0).toUpperCase();
      card.innerHTML = `
        <div class="channel-logo"><div class="letter">${firstLetter}</div></div>
        <div class="channel-info"><div class="channel-name">${escapeHtml(ch.name)}</div><div class="channel-category">${ch.category || 'Entertainment'}</div></div>
      `;
      card.addEventListener('click', () => playChannel(ch));
      grid.appendChild(card);
    });
    document.getElementById('channel-stats').innerHTML = `📡 ${filtered.length} / ${channels.length} channels`;
  }
  
  function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
  
  // Shaka player init
  async function initShaka() {
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) { showMessage("Browser not supported"); return false; }
    shakaPlayer = new shaka.Player(videoEl);
    shakaPlayer.addEventListener('error', (e) => { console.warn(e); showMessage("Stream error, try another"); });
    return true;
  }
  
  async function playChannel(channel) {
    if (!shakaPlayer) await initShaka();
    currentVideoOverlay.classList.add('active');
    audioMsg.style.display = 'none';
    if (channel.type === 'youtube-channel') {
      showMessage(`Opening ${channel.name} on YouTube`, false);
      const url = `https://www.youtube.com/${channel.streamUrl}`;
      window.open(url, '_blank');
      currentVideoOverlay.classList.remove('active');
      return;
    }
    let streamUrl = channel.streamUrl;
    if (!streamUrl) { showMessage("No stream URL"); return; }
    try {
      await shakaPlayer.load(streamUrl);
      if (shakaPlayer.isAudioOnly()) audioMsg.style.display = 'flex';
      else audioMsg.style.display = 'none';
    } catch(e) {
      console.error(e);
      let fallbackOk = false;
      if (channel.standbyUrls && channel.standbyUrls.length) {
        for (let alt of channel.standbyUrls) {
          try { await shakaPlayer.load(alt); fallbackOk = true; break; } catch(e2) {}
        }
      }
      if (!fallbackOk) showMessage(`${channel.name} offline / cannot play`);
    }
  }
  
  function closePlayer() {
    if (shakaPlayer) shakaPlayer.unload();
    currentVideoOverlay.classList.remove('active');
  }
  
  function toggleFullscreen() {
    const container = document.getElementById('shakaContainer');
    if (!document.fullscreenElement) container.requestFullscreen();
    else document.exitFullscreen();
