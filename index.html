function normalizeOffset(offsetStr) { let clean = offsetStr.toString().replace(/^0x/i, '').toUpperCase(); return `0x${clean}`; }
function accurateExtractOffsets(text) {
    const offsetsSet = new Set();

        /HexPatches\.MemoryPatch\s*\(\s*"[^"]*"\s*,\s*(0x[0-9A-Fa-f]+)\s*,/gi,
        /HOOK_LIB\s*\(\s*"[^"]*"\s*,\s*"(0x[0-9A-Fa-f]+)"/gi,
        /EncOff\s*\(\s*(0x[0-9A-Fa-f]+)/gi,
        /(?:Tools::Hook|DobbyHook)\s*\([^,]*,\s*(0x[0-9A-Fa-f]+)/gi,
        /HexPatches\.MemoryPatch\s*\(\s*"[^"]*"\s*,\s*(0x[0-9A-Fa-f]+)/gi

    for (const pattern of patterns) { let match; while ((match = pattern.exec(text)) !== null) offsetsSet.add(normalizeOffset(match[1])); }
    const standaloneHex = /\b(0x[0-9A-Fa-f]{3,8})\b/gi; let match;
    while ((match = standaloneHex.exec(text)) !== null) {
        const offset = normalizeOffset(match[1]); const beforePos = Math.max(0, match.index - 50); const afterPos = Math.min(text.length, match.index + offset.length + 50);
        const context = text.substring(beforePos, afterPos);
        if (context.includes('"') && context.indexOf(offset) > context.indexOf('"') && context.indexOf(offset) < context.lastIndexOf('"')) continue;
        const hexValue = offset.replace('0x', ''); if (hexValue.length >= 3 && hexValue.length <= 8) offsetsSet.add(offset);
    }
    return Array.from(offsetsSet).sort((a,b) => parseInt(a,16)-parseInt(b,16));
}
function normalizeExistingOffsets() {
    const currentText = offsetsTextarea.value.trim(); if(!currentText) return [];
    const lines = currentText.split(/\r?\n/); const unique = new Set();

    return Array.from(unique).sort((a,b)=>parseInt(a,16)-parseInt(b,16));

function updateOffsetsTextarea(offsetsArray) { offsetsTextarea.value = offsetsArray.length ? offsetsArray.join('\n') : ""; }

function parseOffsets(rawText) {

    for(let line of lines) { line = line.trim(); if(!line) continue; let hexStr = line.replace(/^0x/i,''); if(/^[0-9A-Fa-f]+$/.test(hexStr)) { const num = parseInt(hexStr,16); if(!isNaN(num) && isFinite(num) && hexStr.length<=8) offsets.push(num); } }

function generateEncOff(offsets) { let result = "/* EncOff Format */\n"; offsets.forEach(o=> result+=`EncOff(0x${o.toString(16).toUpperCase()}),\n`); return result.trim(); }
function generateBypassOffsets(offsets) { let result = "/* Bypass Offsets */\n"; offsets.forEach((o,i)=> result+=`inline uintptr_t bypass${i+1}=0x${o.toString(16).toUpperCase()};\n`); return result.trim(); }
function generateDirectPatch(offsets, lib, patch) { let result = "/* Direct Memory Patch */\n"; offsets.forEach(o=> result+=`MemoryPatch::createWithHex("${lib}",0x${o.toString(16).toUpperCase()},"${patch.replace(/ /g,'')}").Modify();\n`); return result.trim(); }
function generateArmFalsePatch(offsets, lib) { let result = "/* ArmFalse Patch */\n"; offsets.forEach((o,i)=> result+=`MemoryPatch::createWithHex(OBFUSCATE("${lib}"),bypass${i+1},armFalse).Modify();\n`); return result.trim(); }
function generateToolsHook(offsets, lib) { let result = "/* Tools::Hook */\n"; offsets.forEach(o=> result+=`Tools::Hook((void*)getAbsoluteAddress(OBFUSCATE("${lib}"),0x${o.toString(16).toUpperCase()}),(void*)hook_bypass,(void**)&orig_bypass);\n`); return result.trim(); }
function generateDobbyHook(offsets, lib) { let result = "/* DobbyHook */\n"; offsets.forEach(o=> result+=`DobbyHook((void*)getAbsoluteAddress(OBFUSCATE("${lib}"),0x${o.toString(16).toUpperCase()}),(void*)hook_bypass,(void**)&orig_bypass);\n`); return result.trim(); }
function generateHookLibFormat(offsets, lib) { let result = "/* HOOK_LIB */\n"; offsets.forEach(o=> result+=`HOOK_LIB("${lib}","0x${o.toString(16).toUpperCase()}",h_disabled,o_disabled);\n`); return result.trim(); }
function generateHexPatchInjector(offsets, lib, patch) { let result = "/* HexPatch Injector */\n"; let pfx = patch.trim(); if(!pfx.startsWith('h')) pfx='h'+pfx; offsets.forEach(o=> result+=`HexPatches.MemoryPatch("${lib}",0x${o.toString(16).toUpperCase()},"${pfx}",32);\n`); return result.trim(); }

const formatList = [
    { id:"encoff", title:"EncOff Format", ext:"txt", generator:(o,l,p)=>generateEncOff(o) },
    { id:"bypass_offsets", title:"Bypass Offsets (C++)", ext:"cpp", generator:(o,l,p)=>generateBypassOffsets(o) },
    { id:"direct_patch", title:"Direct Memory Patch", ext:"cpp", generator:(o,l,p)=>generateDirectPatch(o,l,p) },
    { id:"armfalse_patch", title:"ArmFalse Patch", ext:"cpp", generator:(o,l,p)=>generateArmFalsePatch(o,l) },
    { id:"tools_hook", title:"Tools::Hook Calls", ext:"cpp", generator:(o,l,p)=>generateToolsHook(o,l) },
    { id:"dobby_hook", title:"Dobby Hook Calls", ext:"cpp", generator:(o,l,p)=>generateDobbyHook(o,l) },
    { id:"hook_lib", title:"Hook Lib Format", ext:"cpp", generator:(o,l,p)=>generateHookLibFormat(o,l) },
    { id:"hexpatch_injector", title:"HexPatch (Injector LUA)", ext:"lua", generator:(o,l,p)=>generateHexPatchInjector(o,l,p) }
];

function generateAllFormats() {
    const libName = libInput.value.trim(); if(!libName) { showToast("Library name cannot be empty!", true); return; }
    const hexPatchRaw = hexPatchInput.value.trim(); let patchValue = hexPatchRaw || "00 00 80 D2 C0 03 5F D6";
    const offsetRawText = offsetsTextarea.value; if(!offsetRawText.trim()) { showToast("Please enter at least one offset address.", true); return; }
    const offsets = parseOffsets(offsetRawText); if(offsets.length===0) { showToast("No valid hex offsets found!", true); return; }
    showToast(`Parsed ${offsets.length} unique offset(s). Generating...`, false);
    resultsContainer.innerHTML = ""; resultsContainer.classList.remove("active"); globalActionsDiv.classList.remove("visible");
    let combinedOutput = "// Bread Bypass Generator //\n";
    for(const fmt of formatList) {
        let generated = fmt.generator(offsets, libName, patchValue) || `// error ${fmt.title}`;
        combinedOutput += `// ---- ${fmt.title} ----\n${generated}\n\n`;
        const card = document.createElement('div'); card.className='result-card';
        const headerDiv = document.createElement('div'); headerDiv.className='result-header';
        const titleSpan = document.createElement('span'); titleSpan.className='result-title'; titleSpan.textContent=fmt.title;
        const badgeSpan = document.createElement('span'); badgeSpan.style.fontSize="10px"; badgeSpan.style.opacity="0.7"; badgeSpan.textContent=`.${fmt.ext}`;
        headerDiv.appendChild(titleSpan); headerDiv.appendChild(badgeSpan);
        const previewDiv = document.createElement('div'); previewDiv.className='code-preview'; previewDiv.textContent=generated;
        const hiddenStore = document.createElement('textarea'); hiddenStore.className='hidden'; hiddenStore.value=generated;
        const actionsDiv = document.createElement('div'); actionsDiv.className='result-actions';
        const copyBtn = document.createElement('button'); copyBtn.className='btn-tonal'; copyBtn.textContent='Copy';
        copyBtn.onclick=()=>{ navigator.clipboard.writeText(generated).then(()=>showToast(`Copied ${fmt.title}`)).catch(()=>showToast("Copy failed",true)); };
        const saveBtn = document.createElement('button'); saveBtn.className='btn-tonal'; saveBtn.textContent=`Save .${fmt.ext}`;
        saveBtn.onclick=()=>{ downloadBlob(hiddenStore.value,`${fmt.id}_${Date.now()}.${fmt.ext}`); showToast(`Saved ${fmt.id}`); };
        actionsDiv.appendChild(copyBtn); actionsDiv.appendChild(saveBtn);
        card.appendChild(headerDiv); card.appendChild(previewDiv); card.appendChild(hiddenStore); card.appendChild(actionsDiv);
        resultsContainer.appendChild(card);
    }
    masterFullOutput = combinedOutput; resultsContainer.classList.add('active'); globalActionsDiv.classList.add('visible');
    showToast(`Success! ${offsets.length} offsets → ${formatList.length} formats`, false);
}
function downloadBlob(content,filename){ const blob = new Blob([content],{type:"text/plain"}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href); }
function copyAllOutput(){ if(!masterFullOutput){ showToast("Generate first",true); return; } navigator.clipboard.writeText(masterFullOutput).then(()=>showToast("All formats copied")).catch(()=>showToast("Copy failed",true)); }
function saveAllOutput(){ if(!masterFullOutput){ showToast("No output",true); return; } downloadBlob(masterFullOutput,`Bread_Bypass_All_${Date.now()}.txt`); showToast("Saved all formats"); }
async function pasteFromClipboard(){ try{ const text=await navigator.clipboard.readText(); offsetsTextarea.value=text; showToast("Pasted!"); }catch(e){ showToast("Clipboard error",true); } }
generateButton.addEventListener('click', generateAllFormats);
pasteButton.addEventListener('click', pasteFromClipboard);
copyAllButton.addEventListener('click', copyAllOutput);
saveAllButton.addEventListener('click', saveAllOutput);
extractBtn.addEventListener('click', extractAndAddOffsets);
clearExtractBtn.addEventListener('click', clearExtractField);
window.addEventListener('DOMContentLoaded', () => { showToast("🔒 Fully Protected Mode - View Source Blocked", false); });
</script>
</body>
